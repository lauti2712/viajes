<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestro viaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20260924a">
<script>try{var __t=localStorage.getItem('viaje-de-a-dos:theme');if(__t==='light'||__t==='dark')document.documentElement.setAttribute('data-theme',__t);}catch(e){}</script>
</head>
<body>
<header class="top">
  <div class="who2" id="who2"></div>
  <div class="titlerow">
    <h1 id="title">Nuestro viaje</h1>
    <p class="when" id="when"></p>
  </div>
  <div class="hb">
    <button class="ghost" data-act="settings">Ajustes del viaje</button>
    <button class="ghost" data-act="sync">Compartir datos</button>
    <button class="ghost" data-act="theme" id="themeBtn"></button>
    <button class="ghost" data-act="logout" id="logoutBtn" hidden></button>
  </div>
</header>
<nav class="tabs" aria-label="Secciones">
  <div class="in" id="tabs">
    <button class="tab" data-tab="itinerario">Itinerario</button>
    <button class="tab" data-tab="gastos">Gastos</button>
    <button class="tab" data-tab="transportes">Transportes</button>
    <button class="tab" data-tab="alojamiento">Alojamiento</button>
    <button class="tab" data-tab="mochila">Mochila</button>
    <button class="tab" data-tab="pagos" id="tabPagos" hidden>Mis pagos</button>
    <button class="tab" data-tab="resumen">Resumen</button>
  </div>
</nav>
<main id="main"></main>
<div id="sheet" hidden></div>
<div id="updbar" class="updbar" role="status" hidden>Hay una versión nueva de la app: se actualiza cuando cierres esta ventana.</div>

<datalist id="curs"><option value="ARS"><option value="USD"><option value="EUR"><option value="BRL"><option value="CLP"><option value="UYU"><option value="PYG"><option value="BOB"><option value="COP"><option value="MXN"><option value="GBP"></datalist>
<datalist id="methods"><option value="Efectivo"><option value="Tarjeta de crédito"><option value="Tarjeta de débito"><option value="Transferencia"><option value="Mercado Pago"><option value="Millas / puntos"></datalist>

<!-- Al publicar un cambio, subí el ?v= (css y js) para que nadie quede con archivos viejos en caché. -->
<script src="js/config.js?v=20260924a"></script>
<script src="js/core.js?v=20260924a"></script>
<script src="js/plata.js?v=20260924a"></script>
<script src="js/vistas.js?v=20260924a"></script>
<script src="js/mispagos.js?v=20260924a"></script>
<script src="js/formularios.js?v=20260924a"></script>
<script src="js/compartir.js?v=20260924a"></script>
<script src="js/nube.js?v=20260924a"></script>
<script src="js/main.js?v=20260924a"></script>
</body>
</html>
