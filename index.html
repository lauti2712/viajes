<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestro viaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F3EE; --surface:#FBFCF9; --ink:#16223A; --muted:#5B667A; --line:#D9DED3;
  --sea:#1E5AA8; --on-sea:#FFFFFF; --sun:#F4C542; --on-sun:#3A2D00;
  --mint:#237A58; --rose:#C0392B; --p1:#1E5AA8; --p2:#A63D8C; --p3:#C9762B; --p4:#1B8A8A; --p5:#6B4FA0; --p6:#8C6239; --p7:#4A6B8C; --p8:#9A4B4B;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1622; --surface:#172033; --ink:#E8ECF4; --muted:#9AA6BC; --line:#2A3652;
    --sea:#6EA8F0; --on-sea:#0F1622; --sun:#F4C542; --on-sun:#3A2D00;
    --mint:#5CC79A; --rose:#F08A7E; --p1:#6EA8F0; --p2:#E08BCB; --p3:#E0A05C; --p4:#5CC9C9; --p5:#A98FD1; --p6:#C79A6B; --p7:#8CA9C9; --p8:#D18A8A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1622; --surface:#172033; --ink:#E8ECF4; --muted:#9AA6BC; --line:#2A3652;
  --sea:#6EA8F0; --on-sea:#0F1622; --sun:#F4C542; --on-sun:#3A2D00;
  --mint:#5CC79A; --rose:#F08A7E; --p1:#6EA8F0; --p2:#E08BCB; --p3:#E0A05C; --p4:#5CC9C9; --p5:#A98FD1; --p6:#C79A6B; --p7:#8CA9C9; --p8:#D18A8A;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px;border-radius:6px}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}

/* Header */
.top{max-width:780px;margin:0 auto;padding:22px 16px 8px}
.who2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px 3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,46px);line-height:1.02;letter-spacing:-.025em;margin:0;overflow-wrap:anywhere}
.titlerow{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:16px;row-gap:6px;margin-bottom:14px}
.when{margin:0;color:var(--muted);display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font-weight:500}
.when .cal{font-size:15px}
.when b{color:var(--ink);font-weight:700;margin-left:6px}
.hb{display:flex;gap:8px;flex-wrap:wrap}

/* Buttons */
.primary,.ghost,.danger{border-radius:10px;padding:9px 15px;font-weight:700;font-size:15px;border:1.5px solid transparent;line-height:1.2}
.primary{background:var(--sea);color:var(--on-sea)}
.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.ghost:hover{border-color:var(--muted)}
.ghost.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.danger{background:transparent;border-color:var(--rose);color:var(--rose)}
.danger.armed{background:var(--rose);color:#fff}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-top:8px}
.tabs .in{max-width:780px;margin:0 auto;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs .in::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
main{max-width:780px;margin:0 auto;padding:18px 16px 90px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h2{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.015em;margin:0}
h3{font-family:var(--display);font-weight:700;font-size:18px;margin:0}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.sec{border-top:1px solid var(--line);padding-top:16px;margin-top:22px}
.sec>h2{font-size:20px;margin-bottom:12px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:26px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:4px}
.empty p{margin:0;max-width:44ch;margin-inline:auto}
.warn{color:var(--rose);font-size:14px;font-weight:600;margin:8px 0}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin:0 0 6px}
.stats div{min-width:0}
.stats dt{font-size:13px;color:var(--muted);font-weight:600}
.stats dd{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(18px,5vw,24px);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* Balance */
.balance{background:var(--sun);color:var(--on-sun);border-radius:14px;padding:14px 16px;margin-bottom:6px;font-weight:600}
.balance b{font-family:var(--display);font-size:20px}
.bline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:4px 0}
.bline+.bline{border-top:1px dashed rgba(58,45,0,.25)}
.bline>span:first-child{flex:1;min-width:180px}
.balance .ghost{border-color:rgba(58,45,0,.45);color:var(--on-sun);padding:4px 10px;font-size:13px}
.cobro{flex-basis:100%;font-size:13px;font-weight:500}
.cobro b,.hint .cobro b{font-family:var(--body);font-size:14px;overflow-wrap:anywhere}
.cobro .ghost{padding:2px 8px;font-size:12px;margin-left:4px}
.hint .cobro .ghost{color:var(--ink);border-color:var(--line)}

/* Bars */
.bars{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.bars li{display:grid;grid-template-columns:minmax(80px,120px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bt{height:10px;border-radius:99px;background:color-mix(in srgb,var(--muted) 18%,transparent);overflow:hidden}
.bf{display:block;height:100%;border-radius:99px}
.bv{font-variant-numeric:tabular-nums;font-weight:600}

/* Rates */
.rates{display:grid;gap:8px}
.rate{display:flex;align-items:center;gap:8px;font-weight:600}
.rate input{width:130px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.rate.miss input{border-color:var(--rose)}
.rate .dot{margin-right:6px}
.whopick .ghost .dot{margin-right:5px}

/* Ticket */
.ticket{display:grid;grid-template-columns:74px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:0 0 14px;overflow:hidden;cursor:pointer}
.ticket:hover{border-color:var(--muted)}
.stub{position:relative;background:var(--sun);color:var(--on-sun);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:12px 6px;border-right:2px dashed rgba(58,45,0,.35)}
.stub::before,.stub::after{content:"";position:absolute;right:-10px;width:18px;height:18px;border-radius:50%;background:var(--paper)}
.stub::before{top:-10px}.stub::after{bottom:-10px}
.stub .ic{font-size:22px;line-height:1}
.stub b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05}
.stub small{font-size:12px;font-weight:700}
.tb{padding:13px 15px;min-width:0}
.route{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.15;overflow-wrap:anywhere}
.route .ar{color:var(--muted);font-weight:500;padding:0 4px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 2px}
.times span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.times b{font-variant-numeric:tabular-nums;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:14px;color:var(--muted);margin-top:8px}
.meta .ref{font-weight:700;color:var(--ink)}
.note{font-size:14px;color:var(--muted);margin:8px 0 0;white-space:pre-line}
.cost{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;border-top:1px dashed var(--line);margin-top:11px;padding-top:11px}
.cost .amt{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.cost small,.et small,.ea small{font-size:13px;color:var(--muted)}
.who{display:inline-flex;align-items:center;gap:5px}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--mint) 18%,transparent);color:var(--mint)}
.pill.pend{background:color-mix(in srgb,var(--sun) 40%,transparent);color:var(--ink)}
.tot{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted);margin:-4px 0 14px}
.tot b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Lodging */
.stay{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sea);border-radius:12px;padding:13px 15px;margin-bottom:14px;cursor:pointer}
.stay:hover{border-color:var(--muted);border-left-color:var(--sea)}
.stay .nm{font-family:var(--display);font-weight:700;font-size:19px}
.stay .abnb{display:inline-flex;align-items:center;font-family:var(--body);font-size:13px;font-weight:700;color:#FF385C;text-decoration:none;border:1px solid #FF385C;border-radius:999px;padding:2px 10px;vertical-align:middle;margin-left:6px}
.stay .abnb:hover{background:#FF385C;color:#fff}
.stay .dates{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:6px;font-size:14px}
.stay .dates b{font-variant-numeric:tabular-nums}

/* Expenses */
.day{margin-bottom:20px}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.dh b{font-family:var(--display);font-variant-numeric:tabular-nums}
.dh b.over{color:var(--rose)}
.prog{height:4px;border-radius:9px;background:color-mix(in srgb,var(--muted) 18%,transparent);margin-bottom:4px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--mint)}
.prog span.over{background:var(--rose)}
.exp{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.exp:hover{background:color-mix(in srgb,var(--muted) 8%,transparent)}
.ec{font-size:22px;text-align:center}
.et{min-width:0}
.et b{display:block;overflow-wrap:anywhere}
.et small{display:flex;flex-wrap:wrap;gap:0 12px}
.ea{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ea b{font-variant-numeric:tabular-nums}

/* Itinerary */
.iday{margin-bottom:24px}
.ih{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ih .dn{font-size:13px;font-weight:700;color:var(--muted)}
.ih .hoy{font-size:12px;font-weight:800;background:var(--sun);color:var(--on-sun);padding:2px 9px;border-radius:999px}
.ih .sp{flex:1}
.ih .ghost{padding:5px 11px;font-size:14px}
.pl{display:grid;grid-template-columns:54px 1fr;gap:8px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.pl.auto{cursor:default;border-left:3px dashed var(--sun);padding-left:10px;color:var(--muted)}
.pl .t{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.pl b{display:block}
.pl small{display:block;color:var(--muted);font-size:13px;white-space:pre-line}
.tag{font-size:11px;font-weight:800;background:color-mix(in srgb,var(--sun) 45%,transparent);color:var(--ink);padding:1px 7px;border-radius:99px;margin-left:6px}
.nada{color:var(--muted);font-size:14px;padding:6px 2px}

/* Sheet */
#sheet .scrim{position:fixed;inset:0;background:rgba(10,16,28,.55);z-index:20}
#sheet .panel{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:700px){
  #sheet .panel{left:50%;right:auto;bottom:auto;top:5vh;width:min(560px,94vw);max-height:90dvh;transform:translateX(-50%);border-radius:20px;animation:none}
}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ph .x{border:0;background:transparent;font-size:20px;padding:6px 10px;border-radius:8px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.half{grid-column:auto}
.fld>span{font-size:13px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea,.box{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:16px}
.fld textarea,.box{resize:vertical}
.acts{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;margin-top:4px;flex-wrap:wrap}
.acts .danger{margin-right:auto}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.stack{display:grid;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{font-weight:600;min-height:1.4em;margin:6px 0 0}
.msg.err{color:var(--rose)}
.panel hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.sideSec{margin:2px 0 4px}
.sideSec h3{margin-bottom:8px}
.attlist,.lnklist{display:grid;gap:6px;margin-bottom:10px}
.attitem,.lnkitem{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.attitem a,.lnkitem a{display:flex;align-items:center;gap:7px;flex:1;min-width:0;color:var(--ink);text-decoration:none;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.attitem .anm{overflow:hidden;text-overflow:ellipsis}
.attitem .asz{font-size:12px;color:var(--muted);font-weight:500;flex:none}
.attitem .x,.lnkitem .x{flex:none;border:0;background:transparent;color:var(--muted);font-size:15px;padding:4px 6px;border-radius:6px}
.attitem .x:hover,.lnkitem .x:hover{color:var(--rose)}
.filebtn{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chipsm{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);margin-left:8px}

/* Info util */
.infobox{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sea);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.infobox h3{margin-bottom:6px}
.infobox p{margin:0;white-space:pre-line;font-size:15px}

/* Mochila */
.pklist{margin-bottom:26px}
.pkhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.pkhead h3{font-size:18px;display:flex;align-items:center;gap:8px}
.pkcount{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.pk{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line)}
.pk.done .pkchk span{color:var(--muted);text-decoration:line-through}
.pkchk{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;font-weight:600}
.pkchk input{width:19px;height:19px;flex:none;accent-color:var(--sea)}
.pkchk span{overflow-wrap:anywhere}
.pk .x{flex:none;border:0;background:transparent;color:var(--muted);font-size:15px;padding:4px 6px;border-radius:6px}
.pk .x:hover{color:var(--rose)}
.pkadd,.pplform{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.pkadd input[type=text],.pplform input[type=text]{flex:1;min-width:140px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.pksug{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.pksug input{width:16px;height:16px}
.pkadd .ghost,.pplform .ghost{padding:8px 13px;font-size:14px}
.whopick{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.pkadd select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);flex:none}
/* Personas (ajustes) */
.pplrow{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.pplrow input{flex:1;min-width:0;border:0;background:transparent;font-weight:600;padding:4px 2px}
.pplrow small{font-size:12px;color:var(--muted);flex:none}
.pplrow .x{flex:none;border:0;background:transparent;color:var(--muted);font-size:15px;padding:4px 6px;border-radius:6px}
.pplrow .x:hover{color:var(--rose)}
.whopick button[disabled]{opacity:.55;cursor:not-allowed}

/* Login */
.gate{max-width:440px;margin:24px auto;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 20px}
.gate h2{margin-bottom:6px}
.gate p{margin:0 0 16px}
.gate .hint{margin:14px 0 0}
body.gated .tabs,body.gated [data-act=settings],body.gated [data-act=sync]{display:none}
/* Mis pagos */
.mhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.mhead h3{font-size:19px}
.mhead .sp{flex:1}
.mhead small{color:var(--muted);font-weight:600}
.mhead .ghost{padding:5px 11px;font-size:14px}
.stmt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin:10px 0}
.stmt.next{border-left:5px solid var(--sun)}
.stmt .dh{margin-bottom:4px}
.stmt .exp{grid-template-columns:1fr auto;padding:8px 2px}
.strow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}
.strow label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
.strow input{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--paper)}
.strow .x{border:0;background:transparent;color:var(--muted);font-size:15px;padding:8px 6px}
.updbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--sun);color:var(--on-sun);font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){#sheet .panel{animation:none}}
</style>
<script>try{var __t=localStorage.getItem('viaje-de-a-dos:theme');if(__t==='light'||__t==='dark')document.documentElement.setAttribute('data-theme',__t);}catch(e){}</script>
</head>
<body>
<header class="top">
  <div class="who2" id="who2"></div>
  <div class="titlerow">
    <h1 id="title">Nuestro viaje</h1>
    <p class="when" id="when"></p>
  </div>
  <div class="hb">
    <button class="ghost" data-act="settings">Ajustes del viaje</button>
    <button class="ghost" data-act="sync">Compartir datos</button>
    <button class="ghost" data-act="theme" id="themeBtn"></button>
    <button class="ghost" data-act="logout" id="logoutBtn" hidden></button>
  </div>
</header>
<nav class="tabs" aria-label="Secciones">
  <div class="in" id="tabs">
    <button class="tab" data-tab="itinerario">Itinerario</button>
    <button class="tab" data-tab="gastos">Gastos</button>
    <button class="tab" data-tab="transportes">Transportes</button>
    <button class="tab" data-tab="alojamiento">Alojamiento</button>

var pd=function(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
var iso=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

var tm=function(s){var m=/T(\d{2}:\d{2})/.exec(s||'');return m?m[1]:''};

function toBase(a,cur){cur=(cur||base()).toUpperCase();if(cur===base())return a;var r=parseFloat(S.trip.rates[cur]);return r>0?a*r:null;}

function costs(){
  var o=[];
  function add(src,x,title,date,cat){var a=parseFloat(x.amount)||0;if(a<=0)return;o.push({id:x.id,src:src,title:title,date:date,cat:cat,amount:a,cur:(x.cur||base()).toUpperCase(),status:x.status||'pendiente',paidBy:x.paidBy||'',method:(x.method||'').trim(),split:x.split||'equal',splitWith:x.splitWith||'',shares:Array.isArray(x.shares)?x.shares:[],methodId:x.methodId||'',cuotas:x.cuotas||'',payDate:x.payDate||''});}
  live('transports').forEach(function(t){add('transports',t,(t.from||'?')+' → '+(t.to||'?'),(t.dep||'').slice(0,10),'Transporte')});
  live('lodging').forEach(function(l){add('lodging',l,l.name||'Alojamiento',l.in||'','Alojamiento')});
  live('expenses').forEach(function(e){add('expenses',e,e.desc||'Gasto',e.date||'',e.cat||'Otros')});
  return o;
}

/* Reparto de un costo (ya pasado a moneda base `b`) entre personas.
   split: 'equal' = las personas que había al cargarlo (splitWith; vacío en gastos viejos = todas) ·
   'some' = las de splitWith, por igual · 'amounts' = proporcional a shares [{p,a}] ·
   un id de persona = viejo "solo de X". */
function splitIds(x){return String(x.splitWith||'').split(',').filter(Boolean);}
function shareMap(c,b){
  var ids=allPeople().map(function(p){return p.id;}),out={},sp=c.split||'equal';
  if(sp==='amounts'){
    var sh=(c.shares||[]).filter(function(x){return (parseFloat(x.a)||0)>0;}),tot=sh.reduce(function(t,x){return t+parseFloat(x.a);},0);
    if(tot>0){sh.forEach(function(x){out[x.p]=(out[x.p]||0)+b*parseFloat(x.a)/tot;});return out;}
  }
  var who=(sp==='some'||(sp==='equal'&&c.splitWith))?splitIds(c).filter(function(id){return ids.indexOf(id)>=0;}):(sp!=='equal'&&sp!=='amounts'&&ids.indexOf(sp)>=0?[sp]:ids);
  if(!who.length)who=ids;
  who.forEach(function(id){out[id]=b/who.length;});
  return out;
}
function splitLabel(x){
  var sp=x.split||'equal';
  if(sp==='equal')return '';
  if(sp==='amounts')return 'Por montos';
  if(sp==='some')return 'Entre '+splitIds(x).map(nameOf).filter(Boolean).join(', ');
  return 'Solo '+nameOf(sp);
}
function settleUp(){
  var people=allPeople(),net={},any=false,miss=new Set();
  people.forEach(function(p){net[p.id]=0;});
  costs().forEach(function(c){
    if(c.status!=='pagado'||!c.paidBy)return;
    any=true;
    var b=toBase(c.amount,c.cur);
    if(b==null){miss.add(c.cur);return;}
    var sm=shareMap(c,b);
    Object.keys(sm).forEach(function(id){if(net.hasOwnProperty(id))net[id]-=sm[id];});
    if(net.hasOwnProperty(c.paidBy))net[c.paidBy]+=b;
  });
  /* Pagos entre personas (saldar deudas): no son gastos, solo mueven el balance. */
  live('payments').forEach(function(x){
    var a=parseFloat(x.amount)||0;if(a<=0||!x.from||!x.to)return;
    any=true;
    var b=toBase(a,x.cur);
    if(b==null){miss.add((x.cur||'').toUpperCase());return;}
    if(net.hasOwnProperty(x.from))net[x.from]+=b;
    if(net.hasOwnProperty(x.to))net[x.to]-=b;
  });
  return {net:net,any:any,miss:miss,people:people};
}
/* Quién le paga a quién para quedar a mano, con la menor cantidad de transferencias.
   Se buscan grupos de personas cuyos saldos se cancelan entre sí (cada grupo de k personas
   se salda con k-1 transferencias); cuantos más grupos, menos transferencias. Exacto hasta
   16 personas con saldo; con más, se usa directamente el método simple. */
function settlements(){
  var b=settleUp(),nm={};
  b.people.forEach(function(p){nm[p.id]=p.name;});
  var bal=b.people.map(function(p){return {id:p.id,v:Math.round((b.net[p.id]||0)*100)};}).filter(function(x){return Math.abs(x.v)>=50;});
  if(bal.length){  /* los redondeos no pueden dejar plata suelta */
    var res=-bal.reduce(function(t,x){return t+x.v;},0);
    bal.slice().sort(function(x,y){return Math.abs(y.v)-Math.abs(x.v);})[0].v+=res;
  }
  var groups=[bal];
  var n=bal.length;
  if(n>2&&n<=16){
    var full=(1<<n)-1,sum=new Array(full+1),dp=new Array(full+1);
    sum[0]=0;dp[0]=0;
    for(var m=1;m<=full;m++){
      var low=m&-m,i=31-Math.clz32(low);
      sum[m]=sum[m^low]+bal[i].v;
      var best=-1;
      for(var j=0;j<n;j++)if(m&(1<<j)){var d=dp[m^(1<<j)];if(d>best)best=d;}
      dp[m]=best+(sum[m]===0?1:0);
    }
    groups=[];var cur=full,g=[];
    while(cur){
      var add=sum[cur]===0?1:0;
      for(var k=0;k<n;k++)if((cur&(1<<k))&&dp[cur^(1<<k)]+add===dp[cur]){g.push(bal[k]);cur^=1<<k;break;}
      if(sum[cur]===0){groups.push(g);g=[];}
    }
  }
  var out=[];
  groups.forEach(function(grp){
    var cred=grp.filter(function(x){return x.v>0;}).map(function(x){return {id:x.id,amt:x.v};}).sort(function(x,y){return y.amt-x.amt;});
    var deb=grp.filter(function(x){return x.v<0;}).map(function(x){return {id:x.id,amt:-x.v};}).sort(function(x,y){return y.amt-x.amt;});
    var i=0,j=0;
    while(i<deb.length&&j<cred.length){
      var pay=Math.min(deb[i].amt,cred[j].amt);
      if(pay>0)out.push({fromId:deb[i].id,toId:cred[j].id,from:nm[deb[i].id],to:nm[cred[j].id],amt:pay/100});
      deb[i].amt-=pay;cred[j].amt-=pay;
      if(deb[i].amt<=0)i++;
      if(cred[j].amt<=0)j++;
    }
  });
  out.sort(function(x,y){return y.amt-x.amt;});
  return {list:out,any:b.any,miss:b.miss};
}

function balanceHtml(who){

function warnMiss(set){var l=Array.from(set).filter(Boolean);return l.length?'<p class="warn">Falta el tipo de cambio de '+esc(l.join(', '))+'. Cargalo en Resumen para que la suma sea correcta.</p>':'';}
function relTime(ts){
  var s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return 'recién';
  var m=Math.floor(s/60);if(m<60)return 'hace '+m+(m===1?' minuto':' minutos');
  var hh=Math.floor(m/60);if(hh<24)return 'hace '+hh+(hh===1?' hora':' horas');
  var dd=Math.floor(hh/24);return 'hace '+dd+(dd===1?' día':' días');
}
var ratesFetchMsg='';
async function fetchBlueUsd(type){
  ratesFetchMsg='Actualizando cotización…';render();
  try{
    var res=await fetch('https://api.bluelytics.com.ar/v2/latest');
    var j=await res.json();
    var v=j&&j[type]&&j[type].value_sell;
    if(typeof v==='number'&&v>0){
      S.trip.rates.USD=v;S.trip.dollarType=type;S.trip.ratesUpdatedAt=Date.now();S.trip.u=Date.now();
      save();pushTrip();
      ratesFetchMsg='Cotización actualizada.';
    }else ratesFetchMsg='No se pudo leer la cotización. Probá de nuevo en un rato.';
  }catch(e){ratesFetchMsg='No se pudo actualizar la cotización. Probá de nuevo en un rato.';}
  render();
}
async function fetchRates(codes){
  codes=codes.filter(function(c){return c!==base();});
  if(!codes.length)return;
  ratesFetchMsg='Actualizando cotización…';render();
  var ok=[],fail=[];
  for(var i=0;i<codes.length;i++){
    var c=codes[i];
    try{
      var res=await fetch('https://open.er-api.com/v6/latest/'+c);
      var j=await res.json();
      if(j&&j.result==='success'&&j.rates&&typeof j.rates[base()]==='number'){S.trip.rates[c]=j.rates[base()];ok.push(c);}
      else fail.push(c);
    }catch(e){fail.push(c);}
  }
  if(ok.length){S.trip.ratesUpdatedAt=Date.now();S.trip.u=Date.now();save();pushTrip();}
  ratesFetchMsg=fail.length?('No se pudo actualizar la cotización de '+fail.join(' y ')+'. Probá de nuevo en un rato.'):'Cotización actualizada.';
  render();
}

var gastosWho='';
function vGastos(){
  var g={},ppl=allPeople();
  if(gastosWho&&!ppl.some(function(p){return p.id===gastosWho;}))gastosWho='';
  var who=gastosWho;
  function add(dateKey,item,rowFn,u){
    var amt=parseFloat(item.amount)||0,extra='';
    if(who){
      var part=shareMap(item,amt)[who]||0,cur=(item.cur||base()).toUpperCase();
      if(part<=0&&item.paidBy!==who)return;
      extra='<span><b>'+(part>0?'Le toca '+esc(money(part,cur)):'No le toca parte')+'</b></span>';
      amt=part;
    }
    (g[dateKey]=g[dateKey]||[]).push({row:rowFn(extra),amount:amt,cur:item.cur,u:u||0});
  }
  live('expenses').forEach(function(e){add(e.date||'0',e,function(x){return expRow(e,x);},e.u);});
  live('transports').filter(function(t){return (parseFloat(t.amount)||0)>0}).forEach(function(t){
    var ty=TYPES[t.type]||TYPES.otro;
    add((t.dep||'').slice(0,10)||'0',t,function(x){return costRow('transports',t,(t.from||'?')+' → '+(t.to||'?'),ty[0],ty[1],x);},t.u);
  });
  live('lodging').filter(function(l){return (parseFloat(l.amount)||0)>0}).forEach(function(l){
    add(l.in||'0',l,function(x){return costRow('lodging',l,l.name||'Alojamiento','🛏️','Alojamiento',x);},l.u);
  });
  var keys=Object.keys(g).sort().reverse();
  var h='<div class="bar"><h2>Gastos</h2><button class="primary" data-act="add" data-k="expenses">+ Anotar gasto</button></div>';
  if(ppl.length>1)h+='<div class="whopick" style="margin:0 0 14px;gap:6px"><button type="button" class="ghost'+(!who?' active':'')+'" data-act="gwho" data-who="" style="padding:5px 12px;font-size:14px">Todos</button>'
    +ppl.map(function(p){return '<button type="button" class="ghost'+(who===p.id?' active':'')+'" data-act="gwho" data-who="'+esc(p.id)+'" style="padding:5px 12px;font-size:14px">'+dot(p.id)+esc(p.name)+'</button>';}).join('')+'</div>';
  h+=balanceHtml(who);
  if(who&&!keys.length)return h+empty('No hay gastos de '+esc(nameOf(who)),'Ningún gasto cargado lo pagó '+esc(nameOf(who))+' ni le toca una parte.')+paymentsHtml(who)+ratesSectionHtml();
  if(!keys.length)return h+empty('Todavía no anotaron gastos','Cuando estén de viaje, anotá cada gasto: qué fue, cuánto, quién pagó y cómo. Acá se agrupan por día, y también suman los transportes y el alojamiento que cargaste con costo.')+ratesSectionHtml();
  var allEntries=[].concat.apply([],keys.map(function(k){return g[k]}));
  var all=sumBase(allEntries.map(function(x){return {amount:x.amount,cur:x.cur}}).filter(function(c){return c.amount>0}));
  var nd=keys.filter(function(k){return k!=='0'}).length,dl=parseFloat(S.trip.daily)||0;
  if(who){
    var paid=sumBase(costs().filter(function(c){return c.status==='pagado'&&c.paidBy===who;})).t,net=settleUp().net[who]||0;
    h+='<dl class="stats" style="margin-top:12px"><div><dt>Le toca en total</dt><dd>'+money(all.t)+'</dd></div><div><dt>Pagó</dt><dd>'+money(paid)+'</dd></div><div><dt>'+(net>0.5?'Le deben':net<-0.5?'Debe':'Saldo')+'</dt><dd>'+money(Math.abs(net))+'</dd></div></dl>'+(all.miss.size?warnMiss(all.miss):'')+'<div style="height:14px"></div>';
  }else
  h+='<dl class="stats" style="margin-top:12px"><div><dt>Gastos anotados</dt><dd>'+money(all.t)+'</dd></div>'+(nd?'<div><dt>Promedio por día</dt><dd>'+money(all.t/nd)+'</dd></div>':'')+(dl>0?'<div><dt>Presupuesto diario</dt><dd>'+money(dl)+'</dd></div>':'')+'</dl>'+(all.miss.size?warnMiss(all.miss):'')+'<div style="height:14px"></div>';
  h+=keys.map(function(k){
    var items=g[k].slice().sort(function(a,b){return (b.u||0)-(a.u||0)});
    var s=sumBase(items.map(function(x){return {amount:x.amount,cur:x.cur}})),over=dl>0&&s.t>dl;
    return '<section class="day"><div class="dh"><h3>'+(k==='0'?'Sin fecha':esc(fLong(k)))+'</h3><b class="'+(over?'over':'')+'">'+money(s.t)+'</b></div>'+(dl>0?'<div class="prog"><span class="'+(over?'over':'')+'" style="width:'+Math.min(100,s.t/dl*100)+'%"></span></div>':'')+items.map(function(x){return x.row}).join('')+'</section>';
  }).join('');
  h+=paymentsHtml(who)+ratesSectionHtml();
  return h;
}

function daysList(){
  var set=new Set(),s=pd(S.trip.start),e=pd(S.trip.end);
  if(s&&e){var n=dayDiff(s,e);if(n>=0&&n<=120){for(var i=0;i<=n;i++){set.add(iso(new Date(s.getFullYear(),s.getMonth(),s.getDate()+i)));}}}
  live('plans').forEach(function(p){if(p.date)set.add(p.date)});
  live('transports').forEach(function(t){if(t.dep)set.add(t.dep.slice(0,10));if(t.arr)set.add(t.arr.slice(0,10));});
  live('lodging').forEach(function(l){if(l.in)set.add(l.in);if(l.out)set.add(l.out);});

}

var packSuggestMsg='',claimMsg='';
/* Personas: todas viven en la lista `people` (1, 2 o las que sean). Los viajes viejos tenían p1/p2 fijos
   en el trip: se muestran igual hasta que migratePeople() los pasa a `people` con esos mismos ids,
   así los gastos (paidBy/split) y las mochilas (owner) siguen apuntando bien. */
function legacyPeople(){return ['p1','p2'].filter(function(k){return S.trip[k]&&!S.people.some(function(x){return x.id===k});}).map(function(k){return {id:k,name:S.trip[k],c:k==='p1'?1:2};});}
function migratePeople(){['p1','p2'].forEach(function(k,i){if(S.trip[k]&&!S.people.some(function(x){return x.id===k}))upsert('people',null,{id:k,name:S.trip[k],c:i+1});});}
function allPeople(){
  return legacyPeople().concat(live('people').map(function(p){return {id:p.id,name:p.name,c:+p.c||1e15};}))
    .sort(function(a,b){return (a.c-b.c)||a.id.localeCompare(b.id);});
}
function nameOf(id){var p=allPeople().find(function(x){return x.id===id;});return p?p.name:'';}
function suggesterName(it){
  if(it.from)return nameOf(it.from);
  if(it.suggested){if(it.owner==='p1')return nameOf('p2');if(it.owner==='p2')return nameOf('p1');}
  return '';
}
/* Quién soy: en la nube sale de la cuenta de Google (claims), sin nube es una preferencia del dispositivo. */
function myPersonId(){
  var id=cloudMode()?(AUTH==='in'?myClaim:''):getWhoAmI();
  return id&&allPeople().some(function(p){return p.id===id;})?id:'';
}
function packRow(it){
  var suggester=suggesterName(it);
  return '<div class="pk'+(it.checked?' done':'')+'"><label class="pkchk"><input type="checkbox" data-pkcheck="'+it.id+'"'+(it.checked?' checked':'')+'><span>'+esc(it.text)+'</span></label>'+(it.suggested&&suggester?'<span class="chipsm">💡 Idea de '+esc(suggester)+'</span>':'')+'<button type="button" class="x" data-pkdel="'+it.id+'" aria-label="Quitar">✕</button></div>';
}
function myPackList(owner){
  var items=live('packing').filter(function(x){return x.owner===owner}).sort(function(a,b){return (a.u||0)-(b.u||0)});
  var done=items.filter(function(x){return x.checked}).length;
  return '<div class="pklist"><div class="pkhead"><h3>Tu mochila</h3>'+(items.length?'<span class="pkcount">'+done+'/'+items.length+'</span>':'')+'</div>'
   +(items.length?items.map(packRow).join(''):'<p class="nada">Todavía no hay nada acá.</p>')
   +'<form class="pkadd" data-owner="'+esc(owner)+'"><input type="text" data-pktext placeholder="Agregar algo…" autocomplete="off" required><button type="submit" class="ghost">+ Agregar</button></form></div>';
}
function pickerHtml(people){
  var cloud=cloudMode(),h='<div class="bar"><h2>Mi mochila</h2></div>';
  if(cloud&&AUTH!=='in')return h+'<p class="sub">Sin conexión con la nube: tu mochila aparece cuando vuelva la señal.</p>';
  if(cloud)h+='<p class="sub">Hola'+(ME.name?' '+esc(ME.name):'')+'. Elegí quién sos en este viaje: queda vinculado a tu cuenta de Google, así en cualquier dispositivo ves tu propia lista. Es privada: nadie más la puede ver.</p>';
  else h+='<p class="sub">Elegí quién sos en este dispositivo para armar tu propia lista.</p>';
  h+='<div class="whopick">'+people.map(function(p){
    var cl=cloud?CLAIMS[p.id]:null,taken=!!(cl&&cl.uid!==ME.uid);
    return '<button type="button" class="primary" data-act="whoami" data-who="'+esc(p.id)+'"'+(taken?' disabled title="Ya la eligió otra cuenta"':'')+'>'+esc(p.name)+(taken?' · '+esc(cl.name||'otra cuenta'):'')+'</button>';
  }).join('')+'</div>';
  var sugName=cloud&&ME.name&&!people.some(function(p){return p.name.trim().toLowerCase()===ME.name.trim().toLowerCase();})?ME.name:'';
  h+='<form class="pkadd addperson"><input type="text" data-persontext placeholder="Tu nombre, si no está en la lista" value="'+esc(sugName)+'" autocomplete="off" required><button type="submit" class="ghost">+ Agregarme</button></form>';
  if(claimMsg)h+='<p class="msg err">'+esc(claimMsg)+'</p>';
  if(!cloud)h+='<p class="hint" style="margin-top:14px">Ojo: es solo una preferencia de este dispositivo, no una contraseña. Cualquiera que use este celular puede tocar "cambiar" y ver otra lista.</p>';
  return h;
}
function vMochila(){
  var people=allPeople(),who=myPersonId();
  if(!who)return pickerHtml(people);
  var me=people.find(function(p){return p.id===who;}),others=people.filter(function(p){return p.id!==who;});
  var sug='';
  if(others.length){
    sug='<div class="pklist"><div class="pkhead"><h3>💡 Sugerirle algo'+(others.length===1?(' a '+esc(others[0].name)):'')+'</h3></div>'
     +'<form class="pkadd pksuggest">'
     +(others.length>1?('<select data-sugto>'+others.map(function(o){return '<option value="'+esc(o.id)+'">'+esc(o.name)+'</option>';}).join('')+'</select>'):('<input type="hidden" data-sugto value="'+esc(others[0].id)+'">'))
     +'<input type="text" data-pktext placeholder="Ej: protector solar" autocomplete="off" required>'
     +'<button type="submit" class="ghost">Sugerir</button></form>'
     +(packSuggestMsg?'<p class="msg">'+esc(packSuggestMsg)+'</p>':'')+'</div>';
  }
  return '<div class="bar"><h2>Mi mochila</h2><button type="button" class="ghost" data-act="whoswitch" style="padding:6px 12px;font-size:13px">Sos '+esc(me.name)+' · cambiar</button></div>'
   +'<p class="sub">'+(cloudMode()?'Esta lista es solo tuya: está vinculada a tu cuenta de Google y nadie más la puede ver.':'Esta lista es solo tuya: los demás no la ven.')+(others.length?' Podés sugerirles algo a los demás sin ver lo que tienen en la suya.':'')+'</p>'
   +myPackList(who)+sug;
}

/* ---------- Mis pagos: formas de pago de la cuenta (users/{uid}/methods), privadas ---------- */
var METHODS=[];
var MTYPES={credito:['💳','Tarjeta de crédito'],debito:['💳','Tarjeta de débito'],banco:['🏦','Cuenta bancaria'],billetera:['📱','Billetera virtual'],efectivo:['💵','Efectivo'],otro:['🧾','Otro']};
var mtype=function(m){return MTYPES[m.type]||MTYPES.otro};
var methodLabel=function(m){return (m.name||'Sin nombre')+(m.last4?' ••'+m.last4:'')};
function totalsText(lines){var t={};lines.forEach(function(l){t[l.cur]=(t[l.cur]||0)+l.amt;});var ks=Object.keys(t);return ks.length?ks.map(function(c){return money(t[c],c);}).join(' + '):money(0);}
/* Reparte los cargos de una tarjeta en sus resúmenes: cada compra (o cuota) cae en el primer resumen
   que cierra el día de la compra o después; la cuota 2 en el siguiente, etc. */
function cardSchedule(m,charges){
  var st=(m.statements||[]).filter(function(x){return x&&x.c;}).slice().sort(function(a,b){return a.c.localeCompare(b.c);});
  var buckets=st.map(function(x){return {s:x,lines:[]};}),none=[];
  charges.forEach(function(ch){
    var d=ch.payDate||ch.date,n=Math.max(1,Math.min(60,parseInt(ch.cuotas,10)||1));
    var i0=d?st.findIndex(function(x){return d<=x.c;}):-1;
    for(var k=0;k<n;k++){
      var line={ch:ch,k:k+1,n:n,amt:ch.amount/n,cur:ch.cur},idx=i0<0?-1:i0+k;
      if(idx>=0&&idx<buckets.length)buckets[idx].lines.push(line);else none.push(line);
    }
  });
  return {buckets:buckets,none:none};
}
function chargeRow(l){
  var c=l.ch,d=c.payDate||c.date;
  return '<div class="exp" role="button" tabindex="0" data-act="edit" data-k="'+c.src+'" data-id="'+c.id+'"><div class="et"><b>'+esc(c.title)+'</b><small>'+(d?'<span>'+esc(fShort(d))+'</span>':'')+(l.n>1?'<span>Cuota '+l.k+'/'+l.n+'</span>':'')+'</small></div><div class="ea"><b>'+money(l.amt,l.cur)+'</b></div></div>';
}
function vPagos(){
  var h='<div class="bar"><h2>Mis pagos</h2><button class="primary" data-act="addmethod">+ Forma de pago</button></div>'
   +'<p class="sub">Tus tarjetas y cuentas son privadas y te sirven en todos tus viajes. Los demás solo ven el nombre en cada gasto. Nunca cargues el número completo: con los últimos 4 alcanza para reconocerla.</p>';
  if(!METHODS.length)return h+empty('Todavía no cargaste formas de pago','Agregá tus tarjetas de crédito (con las fechas de cierre y vencimiento de cada resumen), débito, cuentas o billeteras. Después, al cargar un gasto, elegís con cuál lo pagaste.');
  var cs=costs(),t=today();
  return h+METHODS.map(function(m){
    var ty=mtype(m),charges=cs.filter(function(c){return c.methodId===m.id;});
    var out='<section class="sec"><div class="mhead"><h3>'+ty[0]+' '+esc(m.name||'Sin nombre')+'</h3><small>'+esc([ty[1],m.bank,m.last4?'••'+m.last4:'',m.alias?'Alias '+m.alias+(m.share?' (visible para tus viajes)':''):''].filter(Boolean).join(' · '))+'</small><span class="sp"></span><button type="button" class="ghost" data-act="editmethod" data-id="'+esc(m.id)+'">Editar</button></div>';
    if(m.type==='credito'){
      var sc=cardSchedule(m,charges),shown=sc.buckets.filter(function(b){return b.lines.length||b.s.v>=t||b.s.c>=t;});
      var nextIdx=shown.findIndex(function(b){return (b.s.v||b.s.c)>=t;});
      if(!(m.statements||[]).length)out+='<p class="warn">Cargá las fechas de cierre y vencimiento de los próximos resúmenes (tocá Editar).</p>';
      out+=shown.map(function(b,i){
        return '<div class="stmt'+(i===nextIdx?' next':'')+'"><div class="dh"><span>Cierra <b>'+esc(fShort(b.s.c))+'</b>'+(b.s.v?' · vence <b>'+esc(fShort(b.s.v))+'</b>':'')+'</span><b>'+(b.lines.length?totalsText(b.lines):'—')+'</b></div>'
         +(b.lines.length?b.lines.map(chargeRow).join(''):'<p class="nada">Sin gastos de este viaje en este resumen.</p>')+'</div>';
      }).join('');
      if(sc.none.length)out+='<div class="stmt"><div class="dh"><span><b>Sin resumen cargado</b></span><b>'+totalsText(sc.none)+'</b></div><p class="hint" style="margin:0 0 4px">Estos cargos caen en resúmenes que todavía no cargaste (o no tienen fecha de compra).</p>'+sc.none.map(chargeRow).join('')+'</div>';
      if(!charges.length&&!shown.length)out+='<p class="nada">Todavía no hay gastos de este viaje con esta tarjeta.</p>';
    }else{
      var lines=charges.map(function(c){return {ch:c,k:1,n:1,amt:c.amount,cur:c.cur};});
      out+=lines.length?'<div class="stmt"><div class="dh"><span>En este viaje</span><b>'+totalsText(lines)+'</b></div>'+lines.map(chargeRow).join('')+'</div>':'<p class="nada">Todavía no hay gastos de este viaje con este medio.</p>';
    }
    return out+'</section>';
  }).join('');
}
function openMethod(id){
  var m=id?METHODS.find(function(x){return x.id===id;}):null;
  var v=m?Object.assign({},m):{type:'credito',name:'',bank:'',last4:''};
  var st=((m&&m.statements)||[]).map(function(x){return {c:x.c||'',v:x.v||''};});
  function stRows(){return st.length?st.map(function(x,i){return '<div class="strow"><label>Cierre<input type="date" data-stc="'+i+'" value="'+esc(x.c)+'"></label><label>Vencimiento<input type="date" data-stv="'+i+'" value="'+esc(x.v)+'"></label><button type="button" class="x" data-strm="'+i+'" aria-label="Quitar resumen">✕</button></div>';}).join(''):'<p class="nada">Sin resúmenes cargados.</p>';}
  var fields=[
    {k:'type',l:'Tipo',t:'select',opts:Object.keys(MTYPES).map(function(k){return [k,MTYPES[k][0]+' '+MTYPES[k][1]];})},
    {k:'name',l:'Nombre para reconocerla',t:'text',req:true,ph:'Ej: Visa Galicia, Cuenta Brubank'},
    {k:'bank',l:'Banco o emisor (opcional)',t:'text',half:true},
    {k:'last4',l:'Últimos 4 dígitos (opcional)',t:'text',half:true,ph:'1234'},
    {k:'alias',l:'Alias o CBU/CVU para que te transfieran',t:'text',ph:'Ej: lauti.viajes.mp'},
    {k:'_share',t:'html',html:'<label class="fld pksug" id="shareWrap" style="flex-direction:row;white-space:normal"><input type="checkbox" name="share"'+(v.share?' checked':'')+'> Mostrarlo a los demás de mis viajes, para que vean a dónde pagarme cuando me deban</label>'}
  ];
  var panel=openSheet(m?'Editar forma de pago':'Nueva forma de pago','<form id="mf" class="grid" novalidate>'+fields.map(function(f){return fieldHtml(f,v);}).join('')
    +'<div class="fld" id="stWrap"><span>Resúmenes de la tarjeta</span><p class="hint" style="margin:0 0 6px">Fecha de cierre y de vencimiento (cuándo hay que pagarlo) de cada resumen, como las publica el banco.</p><div id="stRows">'+stRows()+'</div><div><button type="button" class="ghost" id="staddrow" style="padding:6px 12px;font-size:13px">+ Agregar resumen</button></div></div>'
    +'<p class="msg err" id="mmsg" style="grid-column:1/-1;margin:0"></p><div class="acts">'+(m?'<button type="button" class="danger" id="mdel">Eliminar</button>':'')+'<button type="submit" class="primary">Guardar</button></div></form>');
  var f=$('#mf',panel),l4=$('#f_last4',panel);
  l4.setAttribute('inputmode','numeric');l4.setAttribute('maxlength','4');
  function syncType(){
    var t=$('#f_type',panel).value,cobra=t==='banco'||t==='billetera';
    $('#stWrap',panel).hidden=t!=='credito';
    $('#f_alias',panel).closest('.fld').hidden=!cobra;$('#shareWrap',panel).hidden=!cobra;
  }
  syncType();
  panel.addEventListener('change',function(e){if(e.target.id==='f_type')syncType();});
  panel.addEventListener('input',function(e){
    var i=e.target.getAttribute('data-stc');if(i!=null){st[+i].c=e.target.value;return;}
    i=e.target.getAttribute('data-stv');if(i!=null)st[+i].v=e.target.value;
  });
  panel.addEventListener('click',function(e){
    var rm=e.target.closest('[data-strm]');
    if(rm){st.splice(+rm.getAttribute('data-strm'),1);$('#stRows',panel).innerHTML=stRows();return;}
    if(e.target.closest('#staddrow')){st.push({c:'',v:''});$('#stRows',panel).innerHTML=stRows();}
  });
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var d={};new FormData(f).forEach(function(val,kk){d[kk]=String(val).trim();});
    var msg=$('#mmsg',panel);
    if(!d.name){$('#f_name',panel).focus();return;}
    var digits=(d.last4||'').replace(/\D/g,'');
    if(d.last4&&digits.length!==4){msg.textContent='En "últimos 4 dígitos" poné solo 4 números, nunca el número completo.';return;}
    var stc=d.type==='credito'?st.filter(function(x){return x.c;}).sort(function(a,b){return a.c.localeCompare(b.c);}):[];
    if(stc.some(function(x){return x.v&&x.v<x.c;})){msg.textContent='Hay un resumen que vence antes de cerrar. Revisá las fechas.';return;}
    var cobra=d.type==='banco'||d.type==='billetera';
    saveMethod(Object.assign({},m||{},{id:m?m.id:uid(),type:d.type,name:d.name,bank:d.bank||'',last4:digits,statements:stc,alias:cobra?(d.alias||''):'',share:cobra&&d.alias&&d.share?'1':'',u:Date.now()}));
    closeSheet();
  });
  var del=$('#mdel',panel);
  if(del)del.addEventListener('click',function(){
    if(!del.classList.contains('armed')){del.classList.add('armed');del.textContent='¿Seguro? Tocá de nuevo';return;}
    saveMethod(Object.assign({},m,{del:true,u:Date.now()}));closeSheet();
  });
}

var VIEWS={resumen:vResumen,transportes:vTransportes,alojamiento:vAlojamiento,gastos:vGastos,itinerario:vItinerario,mochila:vMochila,pagos:vPagos};

function renderHead(){
  $('#title').textContent=S.trip.name||'Nuestro viaje';
  var tb=$('#themeBtn');if(tb)tb.textContent=themeLabel();
  var lo=$('#logoutBtn');if(lo){lo.hidden=!(ME&&AUTH==='in');if(ME)lo.textContent='Salir'+(ME.name?' ('+ME.name.split(' ')[0]+')':'');}
  $('#who2').innerHTML=(gated()?[]:allPeople()).map(function(p){return '<span class="chip">'+dot(p.id)+esc(p.name)+'</span>';}).join('')+syncChip();
  var s=pd(S.trip.start),e=pd(S.trip.end),w='';
  if(!s){w='<span>Sin fechas todavía</span>';}
  else{
    var d=dayDiff(pd(today()),s),st='';
    if(d>0)st=d===1?'Falta 1 día':'Faltan '+d+' días';
    else if(e&&dayDiff(pd(today()),e)>=0)st='Día '+(1-d)+' de '+(dayDiff(s,e)+1);
    else if(e)st='Viaje terminado';
    else st='Ya empezó';
    w='<span class="cal" aria-hidden="true">📅</span><span>'+esc(fShort(S.trip.start))+(e?' al '+esc(fShort(S.trip.end)):'')+'</span><b>'+st+'</b>';
  }
  $('#when').innerHTML=w;
  document.title=(S.trip.name||'Nuestro viaje');
}
/* Con nube hay que iniciar sesión con Google antes de ver el viaje. Si Firebase ni siquiera cargó
   (sin señal), AUTH queda 'offline' y se muestra lo guardado en el dispositivo. */
var loginMsg='';
/* Logueado pero sin elegir quién es en el viaje: sin eso no aparecen sus formas de pago ni su mochila. */
var whoLater=false;
function whoBanner(){
  if(!cloudMode()||AUTH!=='in'||!claimsLoaded||whoLater||tab==='mochila'||myPersonId())return '';
  var free=allPeople().filter(function(p){return !CLAIMS[p.id]||CLAIMS[p.id].uid===ME.uid;});
  return '<div class="infobox" style="border-left-color:var(--sun)"><h3>¿Quién sos en este viaje?</h3><p style="margin-bottom:10px">Elegilo una vez y queda vinculado a tu cuenta de Google: así los demás pueden elegir tus formas de pago al cargar un gasto, ven tu alias y tenés tu mochila.</p>'
   +'<div class="whopick" style="margin:0">'+free.map(function(p){return '<button type="button" class="primary" data-act="whoami" data-who="'+esc(p.id)+'">Soy '+esc(p.name)+'</button>';}).join('')
   +'<button type="button" class="ghost" data-tab="mochila">No estoy en la lista</button><button type="button" class="ghost" data-act="wholater">Ahora no</button></div>'+(claimMsg?'<p class="msg err">'+esc(claimMsg)+'</p>':'')+'</div>';
}
function gated(){return cloudMode()&&(AUTH==='pending'||AUTH==='out');}
function vGate(){
  if(AUTH!=='out')return '<p class="sub" style="text-align:center;margin-top:30px">Cargando…</p>';
  return '<div class="gate"><h2>Entrá con Google</h2><p>Para ver y editar este viaje, iniciá sesión con tu cuenta de Google.</p>'
   +'<button type="button" class="primary" data-act="login">Continuar con Google</button>'
   +(loginMsg?'<p class="msg err">'+esc(loginMsg)+'</p>':'')
   +'<p class="hint">Si abriste el link desde Instagram o Facebook y no te deja entrar, abrilo en Chrome o Safari.</p></div>';
}
function render(){
  var g=gated();
  document.body.classList.toggle('gated',g);
  renderHead();
  if(g){$('#main').innerHTML=vGate();return;}
  var canPay=cloudMode()&&AUTH==='in';
  $('#tabPagos').hidden=!canPay;
  if(tab==='pagos'&&!canPay)tab='itinerario';
  $('#main').innerHTML=whoBanner()+VIEWS[tab]();
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
}

/* ---------- Formularios ---------- */
function fieldHtml(f,v){
  if(f.t==='html')return f.html;
  var val=v[f.k]!=null?v[f.k]:(f.def!=null?f.def:''),id='f_'+f.k,inp;
  if(f.t==='select')inp='<select id="'+id+'" name="'+f.k+'">'+f.opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>';
  else if(f.t==='textarea')inp='<textarea id="'+id+'" name="'+f.k+'" rows="3" placeholder="'+esc(f.ph||'')+'">'+esc(val)+'</textarea>';
  else inp='<input id="'+id+'" name="'+f.k+'" type="'+f.t+'" value="'+esc(val)+'"'+(f.list?' list="'+f.list+'"':'')+(f.t==='number'?' step="any" inputmode="decimal" min="0"':'')+' placeholder="'+esc(f.ph||'')+'"'+(f.req?' required':'')+' autocomplete="off">';
  return '<label class="fld'+(f.half?' half':'')+'"><span>'+esc(f.l)+'</span>'+inp+'</label>';
}
function openSheet(title,body){
  formRefresh=null;
  var host=$('#sheet');
  host.innerHTML='<div class="scrim" data-close></div><div class="panel" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="ph"><h2>'+esc(title)+'</h2><button type="button" class="x" data-close aria-label="Cerrar">✕</button></div>'+body+'</div>';
  host.hidden=false;document.body.classList.add('lock');
  return $('.panel',host);
}
var formRefresh=null;
function closeSheet(){formRefresh=null;var h=$('#sheet');h.hidden=true;h.innerHTML='';document.body.classList.remove('lock');if(reloadPending){forceReload(reloadPending);return;}render();if(pendingJoin.length)setTimeout(askJoin,0);}
function sheetForm(o){
  var v=o.values||{};
  var panel=openSheet(o.title,(o.intro||'')+'<form id="sf" class="grid" novalidate>'+o.fields.map(function(f){return fieldHtml(f,v)}).join('')+'<p class="msg err" id="sfmsg" style="grid-column:1/-1;margin:0"></p><div class="acts">'+(o.onDelete?'<button type="button" class="danger" id="del">Eliminar</button>':'')+'<button type="submit" class="primary">Guardar</button></div></form>'+(o.extra||''));
  var f=$('#sf',panel);
  if(o.onReady)o.onReady(panel);
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var d={};new FormData(f).forEach(function(val,k){d[k]=String(val).trim()});
    var req=o.fields.filter(function(x){return x.req&&!d[x.k]})[0];
    if(req){var el=$('#f_'+req.k,panel);if(el)el.focus();return;}
    var bad=o.validate?o.validate(d):'';
    if(bad){var m=$('#sfmsg',panel);if(m)m.textContent=bad;return;}
    o.onSave(d);closeSheet();
  });
  var del=$('#del',panel);
  if(del)del.addEventListener('click',function(){
    if(!del.classList.contains('armed')){del.classList.add('armed');del.textContent='¿Seguro? Tocá de nuevo';return;}
    o.onDelete();closeSheet();
  });
  if(!o.noFocus){var first=$('input:not([type=hidden]),select',f);if(first&&!v.id&&window.matchMedia('(min-width:700px)').matches)first.focus();}
}

function costF(){
  var f=[
    {k:'amount',l:'Monto',t:'number',half:true,ph:'0'},
    {k:'cur',l:'Moneda',t:'text',list:'curs',half:true,def:base()},
    {k:'status',l:'Estado del pago',t:'select',half:true,opts:[['pendiente','Por pagar'],['pagado','Pagado']]},

   que cada uno publica en su vínculo (solo nombre y tipo). null = sin nube, se escribe a mano. */
function payerMethods(pid){
  if(!cloudMode()||!pid)return null;
  if(pid===myPersonId())return METHODS.map(function(m){return {id:m.id,name:m.name||'',type:m.type,label:methodLabel(m)};});

  return c&&c.methods?c.methods.map(function(m){return {id:m.id,name:m.n,type:m.t,label:m.n};}):[];

/* Pasa el formulario de costo a datos: montos, reparto y forma de pago. `ex` es el ítem que se edita. */
function normalizeCost(d,ex){
  if(!('amount' in d))return d;
  d.amount=parseFloat(d.amount)||0;d.cur=(d.cur||base()).toUpperCase().slice(0,6);
  var sw=[],sh=[];
  Object.keys(d).forEach(function(k){
    if(k.indexOf('sw_')===0){sw.push(k.slice(3));delete d[k];}
    else if(k.indexOf('sh_')===0){var a=parseFloat(d[k])||0;if(a>0)sh.push({p:k.slice(3),a:a});delete d[k];}
  });
  /* "Todos" guarda quiénes eran: si después se suma alguien, se pregunta (askJoin) en vez de sumarlo solo. */
  d.splitWith=d.split==='some'?sw.join(','):d.split==='equal'?((ex&&(ex.split||'equal')==='equal'&&ex.splitWith)?ex.splitWith:allPeople().map(function(p){return p.id;}).join(',')):'';
  d.shares=d.split==='amounts'?sh:[];
  if('methodId' in d){
    if(d.methodId==='__other')d.methodId='';
    var m=(payerMethods(d.paidBy)||[]).find(function(x){return x.id===d.methodId;});
    if(m){d.method=m.name;if(m.type!=='credito')d.cuotas='';}
    else if(!(ex&&d.methodId&&d.methodId===ex.methodId))d.cuotas='';
  }else if(cloudMode()&&!d.paidBy){
    d.methodId='';d.cuotas='';   /* sin quién pagó no hay forma de pago de nadie */
  }
  return d;
}
function splitProblem(d){
  var amt=parseFloat(d.amount)||0,keys=Object.keys(d);
  if(d.split==='some'&&!keys.some(function(k){return k.indexOf('sw_')===0;}))return 'Tildá al menos a una persona.';
  if(d.split==='amounts'){
    var sum=keys.filter(function(k){return k.indexOf('sh_')===0;}).reduce(function(t,k){return t+(parseFloat(d[k])||0);},0);
    if(Math.abs(sum-amt)>0.009)return 'Los montos suman '+money(sum,d.cur)+' y el gasto es de '+money(amt,d.cur)+'. Tienen que coincidir.';
  }
  return '';
}

async function uploadFiles(k,id,files,onDone,onMsg){
  if(!FB||!FB.st){onMsg(FIREBASE_CONFIG.apiKey?'Se está conectando con la nube todavía. Probá de nuevo en un segundo.':'Para adjuntar archivos, primero hay que conectar el viaje a la nube.',true);return;}
  for(var i=0;i<files.length;i++){
    var file=files[i];
    if(file.size>20*1024*1024){onMsg('"'+file.name+'" pesa más de 20 MB, no se pudo subir.',true);continue;}
    onMsg('Subiendo '+file.name+'…');
    try{
      var path='trips/'+CODE+'/'+k+'/'+id+'/'+uid()+'_'+file.name.replace(/[^\w.\-]+/g,'_');
      var r=FB.st.ref(FB.storage,path);
      await FB.st.uploadBytes(r,file);
      var url=await FB.st.getDownloadURL(r);
      var it=S[k].find(function(x){return x.id===id}),atts=(it&&it.attachments)?it.attachments.slice():[];
      atts.push({id:uid(),name:file.name,url:url,path:path,size:file.size,type:file.type||''});
      upsert(k,id,{attachments:atts});
      onDone();
    }catch(e){onMsg('No se pudo subir "'+file.name+'". Revisá que Storage esté habilitado y las reglas publicadas.',true);}
  }
  onMsg('');
}

/* Alta de persona: antes se congelan los "todos por igual" viejos (sin splitWith) con quienes estaban,
   y después se pregunta en cuáles entra la nueva. */
var pendingJoin=[];
function freezeEqual(){
  var ids=allPeople().map(function(p){return p.id;}).join(',');
  ['transports','lodging','expenses'].forEach(function(k){live(k).forEach(function(x){
    if((x.split||'equal')==='equal'&&!x.splitWith&&(parseFloat(x.amount)||0)>0)upsert(k,x.id,{split:'equal',splitWith:ids});
  });});
}
function addPerson(name){
  freezeEqual();
  var pid=upsert('people',null,{name:name,c:Date.now()});
  pendingJoin.push(pid);
  return pid;
}
function askJoin(){

   '<p class="hint">Para que todos vean lo mismo en tiempo real, el viaje se guarda en la nube con un código secreto. Cada uno entra con su cuenta de Google.</p><div class="stack">'
   +'<button type="button" class="primary" id="newtrip">Crear un viaje nuevo</button><hr>'
   +'<label class="fld"><span>¿Te pasaron un link o un código?</span><input class="box" id="joinc" placeholder="Pegá el link o el código" autocomplete="off"></label>'
   +'<button type="button" class="ghost" id="join">Unirme a ese viaje</button><p class="msg err" id="msg" role="status"></p><hr>'
   +'<button type="button" class="ghost" id="localonly">Usar solo en este dispositivo</button></div>');
  $('#newtrip',panel).addEventListener('click',function(){connectTo(genCode())});
  $('#join',panel).addEventListener('click',function(){var c=parseCode($('#joinc',panel).value);if(!c){$('#msg',panel).textContent='Ese código no es válido. Pegá el link completo tal cual te lo pasaron.';return;}connectTo(c);});
  $('#localonly',panel).addEventListener('click',function(){try{localStorage.setItem(MODE_KEY,'local');}catch(e){}location.href=location.pathname;});
}

/* ---------- Compartir / copia ---------- */
function downloadFile(name,text){var a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);}
function openSync(){
  var json=JSON.stringify(S),cloud='';
  if(!FIREBASE_CONFIG.apiKey)cloud='<p class="hint">La nube no está activada: falta pegar la configuración de Firebase en el archivo. Mientras tanto, los datos se guardan solo en este dispositivo.</p>';
  else if(CODE)cloud='<p class="hint">El viaje se sincroniza en tiempo real. Pasale este link a quien viaje con vos. Quien lo tenga puede ver y editar el viaje.</p><label class="fld"><span>Link del viaje</span><input class="box" id="lnk" readonly></label><div class="row"><button type="button" class="primary" id="cplnk">Copiar link</button></div>';
  else cloud='<p class="hint">Ahora los datos están solo en este dispositivo.</p><div class="row"><button type="button" class="primary" id="goconnect">Conectar a la nube</button></div>';
  var panel=openSheet('Compartir datos',cloud+'<hr><h3 style="margin-bottom:8px">Copia de seguridad</h3><p class="hint">Podés guardar o pasar una copia de los datos a mano. Al sumar una copia se agrega lo nuevo y, si algo está en los dos lados, queda lo último que se editó.</p>'
   +'<div class="stack"><label class="fld"><span>Tus datos</span><textarea class="box" id="out" rows="3" readonly></textarea></label>'
   +'<div class="row"><button type="button" class="primary" id="cp">Copiar datos</button><button type="button" class="ghost" id="dl">Descargar archivo</button></div>'
   +'<label class="fld"><span>Recibir datos</span><textarea class="box" id="inp" rows="3" placeholder="Pegá acá los datos"></textarea></label>'
   +'<div class="row"><button type="button" class="primary" id="mg">Sumar a mi viaje</button><button type="button" class="ghost" id="pick">Elegir archivo</button><input type="file" id="fi" accept=".json,application/json,text/plain" hidden></div>'
   +'<p class="msg" id="msg" role="status"></p><hr><div class="row"><button type="button" class="danger" id="wipe"></button></div></div>');
  var out=$('#out',panel),msg=$('#msg',panel);
  out.value=json;
  var say=function(t,err){msg.textContent=t;msg.className='msg'+(err?' err':'')};
  var copy=function(text,src,okMsg){
    var ok=function(){say(okMsg)},fail=function(){say('No se pudo copiar. Seleccioná el texto y copialo a mano.',true)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok).catch(function(){src.select();try{document.execCommand('copy');ok();}catch(e){fail();}});}
    else{src.select();try{document.execCommand('copy');ok();}catch(e){fail();}}
  };
  var lnk=$('#lnk',panel);
  if(lnk){lnk.value=location.origin+location.pathname+'?t='+CODE;$('#cplnk',panel).addEventListener('click',function(){copy(lnk.value,lnk,'Link copiado. Mandáselo a quien viaje con vos.')});}
  var gc=$('#goconnect',panel);if(gc)gc.addEventListener('click',function(){try{localStorage.removeItem(MODE_KEY);}catch(e){}openConnect();});
  $('#cp',panel).addEventListener('click',function(){copy(json,out,'Copiado.')});
  $('#dl',panel).addEventListener('click',function(){
    if(DL){DL.save({filename:'viaje.json',data:json}).then(function(){say('Archivo guardado.')}).catch(function(e){if(!e||e.code!=='declined')say('No se pudo guardar el archivo.',true)});}
    else downloadFile('viaje.json',json);
  });
  function doMerge(text){
    try{var o=JSON.parse(text);if(!o||typeof o!=='object'||!o.trip)throw new Error('x');mergeIn(o);say('Listo, se sumaron los datos.');out.value=JSON.stringify(S);json=out.value;renderHead();}
    catch(e){say('Eso no parece un dato de viaje válido. Revisá que esté copiado completo.',true);}
  }
  $('#mg',panel).addEventListener('click',function(){var v=$('#inp',panel).value.trim();if(!v){say('Pegá primero los datos.',true);return;}doMerge(v);});
  $('#pick',panel).addEventListener('click',function(){$('#fi',panel).click()});
  $('#fi',panel).addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){doMerge(String(r.result||''))};r.readAsText(f);});
  var wipe=$('#wipe',panel);
  wipe.textContent=CODE?'Salir de este viaje':'Borrar todo el viaje';
  wipe.addEventListener('click',function(){
    if(!wipe.classList.contains('armed')){wipe.classList.add('armed');wipe.textContent=CODE?'¿Seguro? Los datos siguen en la nube. Tocá de nuevo':'¿Seguro? Se borra todo. Tocá de nuevo';return;}
    if(CODE){try{localStorage.removeItem(LS);localStorage.removeItem(CODE_KEY);}catch(e){}location.href=location.pathname;}
    else{S=blank();save();closeSheet();openSettings();}
  });
}

/* ---------- Eventos ---------- */
document.addEventListener('click',function(e){
  var cp=e.target.closest&&e.target.closest('[data-copy]');
  if(cp){var txt=cp.getAttribute('data-copy'),done=function(){cp.textContent='¡Copiado!';setTimeout(function(){cp.textContent='Copiar';},1500);};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(function(){});
    e.stopPropagation();return;}
  var pd=e.target.closest&&e.target.closest('[data-pkdel]');
  if(pd){remove('packing',pd.getAttribute('data-pkdel'));render();return;}
  var t=e.target.closest('[data-tab],[data-act],[data-close]');if(!t)return;
  if(t.hasAttribute('data-close')){closeSheet();return;}
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);return;}
  var a=t.dataset.act;
  if(a==='add')openItem(t.dataset.k,null,t.dataset.date?{date:t.dataset.date}:null);
  else if(a==='edit')openItem(t.dataset.k,t.dataset.id);
  else if(a==='settings')openSettings();
  else if(a==='sync')openSync();
  else if(a==='theme')cycleTheme();
  else if(a==='fetchrates')fetchRates((t.dataset.codes||'USD,BRL').split(','));
  else if(a==='fetchusd')fetchBlueUsd(t.dataset.type);
  else if(a==='settle')openPayment(null,{from:t.dataset.from,to:t.dataset.to,amount:Math.round(parseFloat(t.dataset.amt)*100)/100,method:'Transferencia'});
  else if(a==='editpay')openPayment(t.dataset.id);
  else if(a==='wholater'){whoLater=true;render();}
  else if(a==='gwho'){gastosWho=t.dataset.who||'';render();}
  else if(a==='whoami'){if(cloudMode())claimPerson(t.dataset.who);else setWhoAmI(t.dataset.who);render();}
  else if(a==='whoswitch'){claimMsg='';if(cloudMode())releaseClaim();else setWhoAmI('');render();}
  else if(a==='login')login();
  else if(a==='addmethod')openMethod(null);
  else if(a==='editmethod')openMethod(t.dataset.id);
  else if(a==='logout')logout();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#sheet').hidden){closeSheet();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.dataset.act){e.preventDefault();e.target.click();}
});
document.addEventListener('change',function(e){
  var r=e.target.closest&&e.target.closest('[data-rate]');
  if(r){S.trip.rates[r.dataset.rate]=parseFloat(r.value)||0;S.trip.u=Date.now();save();pushTrip();render();return;}
  var pc=e.target.closest&&e.target.closest('[data-pkcheck]');
  if(pc){upsert('packing',pc.getAttribute('data-pkcheck'),{checked:pc.checked?'1':''});render();}
});
document.addEventListener('submit',function(e){
  var pform=e.target.closest&&e.target.closest('.addperson');
  if(pform){
    e.preventDefault();
    var nm=pform.querySelector('[data-persontext]').value.trim();
    if(!nm)return;
    var pid=addPerson(nm);
    if(cloudMode())claimPerson(pid);else setWhoAmI(pid);
    render();askJoin();
    return;
  }
  var sform=e.target.closest&&e.target.closest('.pksuggest');
  if(sform){
    e.preventDefault();
    var toEl=sform.querySelector('[data-sugto]'),owner2=toEl?toEl.value:'',txt2=sform.querySelector('[data-pktext]').value.trim();
    if(!txt2||!owner2)return;
    sendSuggestion(owner2,txt2);
    packSuggestMsg='Listo, se lo sugerimos.';
    render();
    return;
  }
  var form=e.target.closest&&e.target.closest('.pkadd');
  if(form){
    e.preventDefault();
    var owner=form.dataset.owner,txt=form.querySelector('[data-pktext]').value.trim();
    if(!txt)return;
    upsert('packing',null,{owner:owner,text:txt,checked:'',suggested:'',from:''});
    render();
  }
});

if(!cloudMode())migratePeople();
render();
if(!FIREBASE_CONFIG.apiKey){if(!S.trip.setup)openSettings();}
else if(LOCAL_ONLY){syncState='local';renderHead();if(!S.trip.setup)openSettings();}
else if(!CODE){syncState='none';renderHead();openConnect();}
else startCloud();
})();
</script>
</body>
</html>
