<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viaje de a dos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F3EE; --surface:#FBFCF9; --ink:#16223A; --muted:#5B667A; --line:#D9DED3;
  --sea:#1E5AA8; --on-sea:#FFFFFF; --sun:#F4C542; --on-sun:#3A2D00;
  --mint:#237A58; --rose:#C0392B; --p1:#1E5AA8; --p2:#A63D8C;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1622; --surface:#172033; --ink:#E8ECF4; --muted:#9AA6BC; --line:#2A3652;
    --sea:#6EA8F0; --on-sea:#0F1622; --sun:#F4C542; --on-sun:#3A2D00;
    --mint:#5CC79A; --rose:#F08A7E; --p1:#6EA8F0; --p2:#E08BCB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1622; --surface:#172033; --ink:#E8ECF4; --muted:#9AA6BC; --line:#2A3652;
  --sea:#6EA8F0; --on-sea:#0F1622; --sun:#F4C542; --on-sun:#3A2D00;
  --mint:#5CC79A; --rose:#F08A7E; --p1:#6EA8F0; --p2:#E08BCB;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px;border-radius:6px}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}

/* Header */
.top{max-width:780px;margin:0 auto;padding:22px 16px 8px}
.who2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px 3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,46px);line-height:1.02;letter-spacing:-.025em;margin:0 0 8px;overflow-wrap:anywhere}
.when{margin:0 0 14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px;font-weight:500}
.when b{color:var(--ink);font-weight:700}
.hb{display:flex;gap:8px;flex-wrap:wrap}

/* Buttons */
.primary,.ghost,.danger{border-radius:10px;padding:9px 15px;font-weight:700;font-size:15px;border:1.5px solid transparent;line-height:1.2}
.primary{background:var(--sea);color:var(--on-sea)}
.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.ghost:hover{border-color:var(--muted)}
.danger{background:transparent;border-color:var(--rose);color:var(--rose)}
.danger.armed{background:var(--rose);color:#fff}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-top:8px}
.tabs .in{max-width:780px;margin:0 auto;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs .in::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
main{max-width:780px;margin:0 auto;padding:18px 16px 90px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h2{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.015em;margin:0}
h3{font-family:var(--display);font-weight:700;font-size:18px;margin:0}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.sec{border-top:1px solid var(--line);padding-top:16px;margin-top:22px}
.sec>h2{font-size:20px;margin-bottom:12px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:26px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:4px}
.empty p{margin:0;max-width:44ch;margin-inline:auto}
.warn{color:var(--rose);font-size:14px;font-weight:600;margin:8px 0}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin:0 0 6px}
.stats div{min-width:0}
.stats dt{font-size:13px;color:var(--muted);font-weight:600}
.stats dd{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(18px,5vw,24px);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* Balance */
.balance{background:var(--sun);color:var(--on-sun);border-radius:14px;padding:14px 16px;margin-bottom:6px;font-weight:600}
.balance b{font-family:var(--display);font-size:20px}

/* Bars */
.bars{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.bars li{display:grid;grid-template-columns:minmax(80px,120px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bt{height:10px;border-radius:99px;background:color-mix(in srgb,var(--muted) 18%,transparent);overflow:hidden}
.bf{display:block;height:100%;border-radius:99px}
.bv{font-variant-numeric:tabular-nums;font-weight:600}

/* Rates */
.rates{display:grid;gap:8px}
.rate{display:flex;align-items:center;gap:8px;font-weight:600}
.rate input{width:130px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.rate.miss input{border-color:var(--rose)}

/* Ticket */
.ticket{display:grid;grid-template-columns:74px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:0 0 14px;overflow:hidden;cursor:pointer}
.ticket:hover{border-color:var(--muted)}
.stub{position:relative;background:var(--sun);color:var(--on-sun);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:12px 6px;border-right:2px dashed rgba(58,45,0,.35)}
.stub::before,.stub::after{content:"";position:absolute;right:-10px;width:18px;height:18px;border-radius:50%;background:var(--paper)}
.stub::before{top:-10px}.stub::after{bottom:-10px}
.stub .ic{font-size:22px;line-height:1}
.stub b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05}
.stub small{font-size:12px;font-weight:700}
.tb{padding:13px 15px;min-width:0}
.route{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.15;overflow-wrap:anywhere}
.route .ar{color:var(--muted);font-weight:500;padding:0 4px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 2px}
.times span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.times b{font-variant-numeric:tabular-nums;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:14px;color:var(--muted);margin-top:8px}
.meta .ref{font-weight:700;color:var(--ink)}
.note{font-size:14px;color:var(--muted);margin:8px 0 0;white-space:pre-line}
.cost{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;border-top:1px dashed var(--line);margin-top:11px;padding-top:11px}
.cost .amt{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.cost small,.et small,.ea small{font-size:13px;color:var(--muted)}
.who{display:inline-flex;align-items:center;gap:5px}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--mint) 18%,transparent);color:var(--mint)}
.pill.pend{background:color-mix(in srgb,var(--sun) 40%,transparent);color:var(--ink)}
.tot{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted);margin:-4px 0 14px}
.tot b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Lodging */
.stay{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sea);border-radius:12px;padding:13px 15px;margin-bottom:14px;cursor:pointer}
.stay:hover{border-color:var(--muted);border-left-color:var(--sea)}
.stay .nm{font-family:var(--display);font-weight:700;font-size:19px}
.stay .abnb{display:inline-flex;align-items:center;font-family:var(--body);font-size:13px;font-weight:700;color:#FF385C;text-decoration:none;border:1px solid #FF385C;border-radius:999px;padding:2px 10px;vertical-align:middle;margin-left:6px}
.stay .abnb:hover{background:#FF385C;color:#fff}
.stay .dates{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:6px;font-size:14px}
.stay .dates b{font-variant-numeric:tabular-nums}

/* Expenses */
.day{margin-bottom:20px}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.dh b{font-family:var(--display);font-variant-numeric:tabular-nums}
.dh b.over{color:var(--rose)}
.prog{height:4px;border-radius:9px;background:color-mix(in srgb,var(--muted) 18%,transparent);margin-bottom:4px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--mint)}
.prog span.over{background:var(--rose)}
.exp{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.exp:hover{background:color-mix(in srgb,var(--muted) 8%,transparent)}
.ec{font-size:22px;text-align:center}
.et{min-width:0}
.et b{display:block;overflow-wrap:anywhere}
.et small{display:flex;flex-wrap:wrap;gap:0 12px}
.ea{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ea b{font-variant-numeric:tabular-nums}

/* Itinerary */
.iday{margin-bottom:24px}
.ih{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ih .dn{font-size:13px;font-weight:700;color:var(--muted)}
.ih .hoy{font-size:12px;font-weight:800;background:var(--sun);color:var(--on-sun);padding:2px 9px;border-radius:999px}
.ih .sp{flex:1}
.ih .ghost{padding:5px 11px;font-size:14px}
.pl{display:grid;grid-template-columns:54px 1fr;gap:8px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.pl.auto{cursor:default;border-left:3px dashed var(--sun);padding-left:10px;color:var(--muted)}
.pl .t{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.pl b{display:block}
.pl small{display:block;color:var(--muted);font-size:13px;white-space:pre-line}
.tag{font-size:11px;font-weight:800;background:color-mix(in srgb,var(--sun) 45%,transparent);color:var(--ink);padding:1px 7px;border-radius:99px;margin-left:6px}
.nada{color:var(--muted);font-size:14px;padding:6px 2px}

/* Sheet */
#sheet .scrim{position:fixed;inset:0;background:rgba(10,16,28,.55);z-index:20}
#sheet .panel{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:700px){
  #sheet .panel{left:50%;right:auto;bottom:auto;top:5vh;width:min(560px,94vw);max-height:90dvh;transform:translateX(-50%);border-radius:20px;animation:none}
}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ph .x{border:0;background:transparent;font-size:20px;padding:6px 10px;border-radius:8px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.half{grid-column:auto}
.fld>span{font-size:13px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea,.box{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:16px}
.fld textarea,.box{resize:vertical}
.acts{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;margin-top:4px;flex-wrap:wrap}
.acts .danger{margin-right:auto}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.stack{display:grid;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{font-weight:600;min-height:1.4em;margin:6px 0 0}
.msg.err{color:var(--rose)}
.panel hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.sideSec{margin:2px 0 4px}
.sideSec h3{margin-bottom:8px}
.attlist,.lnklist{display:grid;gap:6px;margin-bottom:10px}
.attitem,.lnkitem{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.attitem a,.lnkitem a{display:flex;align-items:center;gap:7px;flex:1;min-width:0;color:var(--ink);text-decoration:none;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.attitem .anm{overflow:hidden;text-overflow:ellipsis}
.attitem .asz{font-size:12px;color:var(--muted);font-weight:500;flex:none}
.attitem .x,.lnkitem .x{flex:none;border:0;background:transparent;color:var(--muted);font-size:15px;padding:4px 6px;border-radius:6px}
.attitem .x:hover,.lnkitem .x:hover{color:var(--rose)}
.filebtn{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chipsm{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);margin-left:8px}
@media (prefers-reduced-motion:reduce){#sheet .panel{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="who2" id="who2"></div>
  <h1 id="title">Nuestro viaje</h1>
  <p class="when" id="when"></p>
  <div class="hb">
    <button class="ghost" data-act="settings">Ajustes del viaje</button>
    <button class="ghost" data-act="sync">Compartir datos</button>
  </div>
</header>
<nav class="tabs" aria-label="Secciones">
  <div class="in" id="tabs">
    <button class="tab" data-tab="resumen">Resumen</button>

    <button class="tab" data-tab="alojamiento">Alojamiento</button>
    <button class="tab" data-tab="gastos">Gastos</button>
    <button class="tab" data-tab="itinerario">Itinerario</button>
  </div>
</nav>
<main id="main"></main>
<div id="sheet" hidden></div>

<datalist id="curs"><option value="ARS"><option value="USD"><option value="EUR"><option value="BRL"><option value="CLP"><option value="UYU"><option value="PYG"><option value="BOB"><option value="COP"><option value="MXN"><option value="GBP"></datalist>
<datalist id="methods"><option value="Efectivo"><option value="Tarjeta de crédito"><option value="Tarjeta de débito"><option value="Transferencia"><option value="Mercado Pago"><option value="Millas / puntos"></datalist>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)};
var LS='viaje-de-a-dos:v1';

/* ====== FIREBASE: pegá acá tu configuración (Consola > Configuración del proyecto > Tus apps > Web) ====== */
var FIREBASE_CONFIG={
  apiKey:"AIzaSyARMDTJSRVhHLlGmK83zJn4fI2fM6R4meQ",
  authDomain:"viajeiguazu-7104e.firebaseapp.com",
  projectId:"viajeiguazu-7104e",
  storageBucket:"viajeiguazu-7104e.firebasestorage.app",
  messagingSenderId:"783661170294",
  appId:"1:783661170294:web:192ffe6f0ea7d3bcdfa957"
};
var FB_VER='10.14.1';
/* ================================================================================================= */
var CODE_KEY='viaje-de-a-dos:code',MODE_KEY='viaje-de-a-dos:mode';
var CODE='',LOCAL_ONLY=false,FB=null,syncState='';
try{CODE=localStorage.getItem(CODE_KEY)||'';LOCAL_ONLY=localStorage.getItem(MODE_KEY)==='local';}catch(e){}
var ITEM_KEYS=['transports','lodging','expenses','plans'];

var TYPES={vuelo:['✈️','Vuelo'],bus:['🚌','Micro / bus'],tren:['🚆','Tren'],barco:['⛴️','Barco'],auto:['🚗','Auto alquilado'],traslado:['🚕','Traslado'],otro:['🧭','Otro']};
var CATS={'Comida':'🍽️','Transporte local':'🚇','Actividades':'🎟️','Compras':'🛍️','Salud':'💊','Otros':'📌'};
var ITYPES={paseo:['🚶','Paseo'],comida:['🍽️','Comida'],excursion:['🗺️','Excursión'],tramite:['📄','Trámite'],descanso:['🛌','Descanso'],otro:['📌','Otro']};

/* ---------- Estado ---------- */
function blank(){return {v:1,trip:{name:'Nuestro viaje',start:'',end:'',p1:'Persona 1',p2:'Persona 2',base:'ARS',rates:{},daily:0,setup:false,u:0},transports:[],lodging:[],expenses:[],plans:[]};}
var arr=function(a){return Array.isArray(a)?a.filter(function(x){return x&&x.id}):[]};
function fix(o){var b=blank();o=o||{};var t=Object.assign(b.trip,o.trip||{});t.rates=Object.assign({},(o.trip&&o.trip.rates)||{});return {v:1,trip:t,transports:arr(o.transports),lodging:arr(o.lodging),expenses:arr(o.expenses),plans:arr(o.plans)};}
var S=blank();
try{var raw=localStorage.getItem(LS);if(raw)S=fix(JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
try{
  var qp=(new URLSearchParams(location.search).get('t')||'').toLowerCase();
  if(qp&&FIREBASE_CONFIG.apiKey&&/^[a-z0-9]{12,40}$/.test(qp)){
    if(CODE&&CODE!==qp){S=blank();save();}
    CODE=qp;LOCAL_ONLY=false;
    localStorage.setItem(CODE_KEY,CODE);localStorage.removeItem(MODE_KEY);
    history.replaceState(null,'',location.pathname);
  }
}catch(e){}
var live=function(k){return S[k].filter(function(x){return !x.del})};
function upsert(k,id,data){var now=Date.now(),i=id?S[k].findIndex(function(x){return x.id===id}):-1,it;if(i>=0){it=S[k][i]=Object.assign({},S[k][i],data,{u:now});}else{it=Object.assign({id:uid(),u:now},data);S[k].push(it);}save();pushItem(k,it);return it.id;}
function remove(k,id){var x=S[k].find(function(y){return y.id===id});if(x){x.del=true;x.u=Date.now();save();pushItem(k,x);}}

/* ---------- Fechas y plata ---------- */
var pd=function(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
var iso=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var today=function(){return iso(new Date())};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1)};
var fLong=function(s){var d=pd(s);return d?cap(d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})):''};
var fShort=function(s){var d=pd(s);return d?d.toLocaleDateString('es-AR',{day:'numeric',month:'short'}).replace('.',''):''};
var mon=function(s){var d=pd(s);return d?d.toLocaleDateString('es-AR',{month:'short'}).replace('.',''):''};
var tm=function(s){var m=/T(\d{2}:\d{2})/.exec(s||'');return m?m[1]:''};
var dayDiff=function(a,b){return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5)};
var base=function(){return (S.trip.base||'ARS').toUpperCase()};
var fmtC={};
function money(n,cur){cur=(cur||base()).toUpperCase();try{var f=fmtC[cur]||(fmtC[cur]=new Intl.NumberFormat('es-AR',{style:'currency',currency:cur,minimumFractionDigits:0,maximumFractionDigits:2}));return f.format(n);}catch(e){return cur+' '+(Math.round(n*100)/100).toLocaleString('es-AR');}}
function toBase(a,cur){cur=(cur||base()).toUpperCase();if(cur===base())return a;var r=parseFloat(S.trip.rates[cur]);return r>0?a*r:null;}
var pn=function(p){return p==='p1'?S.trip.p1:p==='p2'?S.trip.p2:''};
var dot=function(p){return (p==='p1'||p==='p2')?'<i class="dot" style="background:var(--'+p+')"></i>':''};

function costs(){
  var o=[];
  function add(src,x,title,date,cat){var a=parseFloat(x.amount)||0;if(a<=0)return;o.push({id:x.id,src:src,title:title,date:date,cat:cat,amount:a,cur:(x.cur||base()).toUpperCase(),status:x.status||'pendiente',paidBy:x.paidBy||'',method:(x.method||'').trim(),split:x.split||'equal'});}
  live('transports').forEach(function(t){add('transports',t,(t.from||'?')+' → '+(t.to||'?'),(t.dep||'').slice(0,10),'Transporte')});
  live('lodging').forEach(function(l){add('lodging',l,l.name||'Alojamiento',l.in||'','Alojamiento')});
  live('expenses').forEach(function(e){add('expenses',e,e.desc||'Gasto',e.date||'',e.cat||'Otros')});
  return o;
}
function sumBase(list){var t=0,miss=new Set();list.forEach(function(c){var b=toBase(c.amount,c.cur);if(b==null)miss.add((c.cur||'').toUpperCase());else t+=b;});return {t:t,miss:miss};}
function balance(){var n1=0,any=false,miss=new Set();costs().forEach(function(c){if(c.status!=='pagado'||!c.paidBy)return;any=true;var b=toBase(c.amount,c.cur);if(b==null){miss.add(c.cur);return;}var s1=c.split==='equal'?b/2:c.split==='p1'?b:0;n1+=(c.paidBy==='p1'?b:0)-s1;});return {n1:n1,any:any,miss:miss};}
function balanceHtml(){
  var b=balance();if(!b.any)return '';
  if(Math.abs(b.n1)<0.5)return '<div class="balance">Están a mano. Nadie le debe nada a nadie.</div>';
  var debtor=b.n1>0?S.trip.p2:S.trip.p1,cred=b.n1>0?S.trip.p1:S.trip.p2;
  return '<div class="balance">'+esc(debtor)+' le debe <b>'+money(Math.abs(b.n1))+'</b> a '+esc(cred)+'</div>'+(b.miss.size?warnMiss(b.miss):'');
}
function warnMiss(set){var l=Array.from(set).filter(Boolean);return l.length?'<p class="warn">Falta el tipo de cambio de '+esc(l.join(', '))+'. Cargalo en Resumen para que la suma sea correcta.</p>':'';}

/* ---------- Componentes ---------- */
var empty=function(t,p){return '<div class="empty"><b>'+t+'</b><p>'+p+'</p></div>'};
function bars(rows){if(!rows.length)return '<p class="sub">Sin datos todavía.</p>';var mx=Math.max.apply(null,rows.map(function(r){return r.v}).concat([1]));return '<ul class="bars">'+rows.map(function(r){return '<li><span class="bl" title="'+esc(r.l)+'">'+esc(r.l)+'</span><span class="bt"><span class="bf" style="width:'+(r.v/mx*100).toFixed(1)+'%;background:'+(r.c||'var(--sea)')+'"></span></span><span class="bv">'+money(r.v)+'</span></li>'}).join('')+'</ul>';}
function costBlock(x){
  var a=parseFloat(x.amount)||0;
  if(a<=0)return '<div class="cost"><span class="pill pend">Sin costo cargado</span></div>';
  var cur=(x.cur||base()).toUpperCase(),ok=x.status==='pagado',b=toBase(a,cur);
  return '<div class="cost"><b class="amt">'+money(a,cur)+'</b>'+(cur!==base()?'<small>'+(b==null?'sin tipo de cambio':'≈ '+money(b))+'</small>':'')+'<span class="pill '+(ok?'ok':'pend')+'">'+(ok?'Pagado':'Por pagar')+'</span>'+(x.paidBy?'<small class="who">'+dot(x.paidBy)+esc(pn(x.paidBy))+'</small>':'')+(x.method?'<small>'+esc(x.method)+'</small>':'')+(x.split&&x.split!=='equal'?'<small>Solo '+esc(pn(x.split))+'</small>':'')+'</div>';
}
function totLine(list){var t=sumBase(list),p=sumBase(list.filter(function(c){return c.status==='pagado'}));if(!list.length)return '';return '<div class="tot"><span>Total <b>'+money(t.t)+'</b></span><span>Pagado <b>'+money(p.t)+'</b></span><span>Por pagar <b>'+money(t.t-p.t)+'</b></span></div>'+(t.miss.size?warnMiss(t.miss):'');}

/* ---------- Vistas ---------- */
var tab='resumen';

function upcoming(){
  var now=today()+'T'+new Date().toTimeString().slice(0,5),ev=[];
  live('transports').forEach(function(t){if(t.dep&&t.dep>=now)ev.push({k:t.dep,d:t.dep.slice(0,10),t:tm(t.dep),l:(TYPES[t.type]||TYPES.otro)[0]+' '+(t.from||'?')+' → '+(t.to||'?')});});
  live('plans').forEach(function(p){var k=(p.date||'')+'T'+(p.time||'00:00');if(p.date&&k>=now)ev.push({k:k,d:p.date,t:p.time||'',l:(ITYPES[p.type]||ITYPES.otro)[0]+' '+(p.title||'Plan')});});
  live('lodging').forEach(function(l){if(l.in&&l.in+'T15:00'>=now)ev.push({k:l.in+'T15:00',d:l.in,t:'',l:'🛏️ Check-in: '+(l.name||'')});});
  return ev.sort(function(a,b){return a.k.localeCompare(b.k)}).slice(0,4);
}

function vResumen(){
  var cs=costs(),h='',up=upcoming();
  h+=balanceHtml();
  if(up.length){h+='<section class="sec"><h2>Lo que sigue</h2><div>'+up.map(function(e){return '<div class="pl auto"><span class="t">'+esc(fShort(e.d))+(e.t?'<br>'+e.t:'')+'</span><div><b>'+esc(e.l)+'</b></div></div>'}).join('')+'</div></section>';}
  if(!cs.length){h+='<section class="sec">'+empty('Acá va a aparecer el resumen de plata','Cargá transportes, alojamiento o gastos con su monto y vamos sumando el total, lo pagado y lo que falta.')+'</section>';return h;}
  var tot=sumBase(cs),pg=sumBase(cs.filter(function(c){return c.status==='pagado'})),pe=tot.t-pg.t;
  h+='<section class="sec"><h2>Plata del viaje</h2><dl class="stats"><div><dt>Total</dt><dd>'+money(tot.t)+'</dd></div><div><dt>Ya pagado</dt><dd>'+money(pg.t)+'</dd></div><div><dt>Por pagar</dt><dd>'+money(pe)+'</dd></div></dl>'+(tot.miss.size?warnMiss(tot.miss):'')+'</section>';

  var curs=Array.from(new Set(cs.map(function(c){return c.cur}))).filter(function(c){return c!==base()});
  if(curs.length){h+='<section class="sec"><h2>Tipos de cambio</h2><p class="sub">Cuánto vale 1 unidad de cada moneda en '+esc(base())+'. Con esto se suma todo junto.</p><div class="rates">'+curs.map(function(c){var v=S.trip.rates[c];return '<label class="rate'+(v>0?'':' miss')+'"><span>1 '+esc(c)+' =</span><input type="number" step="any" min="0" inputmode="decimal" data-rate="'+esc(c)+'" value="'+(v>0?v:'')+'" placeholder="0"><span>'+esc(base())+'</span></label>'}).join('')+'</div></section>';}

  var pp=[['p1',S.trip.p1],['p2',S.trip.p2]].map(function(p){return {l:p[1],c:'var(--'+p[0]+')',v:sumBase(cs.filter(function(c){return c.status==='pagado'&&c.paidBy===p[0]})).t}});
  h+='<section class="sec"><h2>Quién puso la plata</h2>'+bars(pp)+'</section>';

  var byCat={};cs.forEach(function(c){var b=toBase(c.amount,c.cur);if(b!=null)byCat[c.cat]=(byCat[c.cat]||0)+b;});
  h+='<section class="sec"><h2>En qué se va</h2>'+bars(Object.keys(byCat).map(function(k){return {l:(CATS[k]?CATS[k]+' ':k==='Transporte'?'✈️ ':k==='Alojamiento'?'🛏️ ':'')+k,v:byCat[k]}}).sort(function(a,b){return b.v-a.v}))+'</section>';

  var byM={};cs.filter(function(c){return c.status==='pagado'}).forEach(function(c){var b=toBase(c.amount,c.cur);if(b!=null){var m=c.method||'Sin especificar';byM[m]=(byM[m]||0)+b;}});
  h+='<section class="sec"><h2>Cómo lo pagamos</h2>'+bars(Object.keys(byM).map(function(k){return {l:k,v:byM[k],c:'var(--mint)'}}).sort(function(a,b){return b.v-a.v}))+'</section>';
  return h;
}

function attLinkChips(item){
  var n=(item&&item.attachments)?item.attachments.length:0,m=(item&&item.links)?item.links.length:0,out=[];
  if(n)out.push('<span class="chipsm">📎 '+n+'</span>');
  if(m)out.push('<span class="chipsm">🔗 '+m+'</span>');
  return out.join('');
}
function fileIcon(type){return type&&type.indexOf('pdf')>=0?'📄':(type&&type.indexOf('image')>=0?'🖼️':'📎')}
function humanSize(n){n=n||0;if(n<1024)return n+' B';if(n<1048576)return Math.round(n/1024)+' KB';return (n/1048576).toFixed(1)+' MB';}
function ticket(t){
  var ty=TYPES[t.type]||TYPES.otro,dd=(t.dep||'').slice(0,10),ad=(t.arr||'').slice(0,10);
  return '<div class="ticket" role="button" tabindex="0" data-act="edit" data-k="transports" data-id="'+t.id+'">'
   +'<div class="stub"><span class="ic" aria-hidden="true">'+ty[0]+'</span>'+(dd?'<b>'+pd(dd).getDate()+'</b><small>'+esc(mon(dd))+'</small>':'<small>Sin fecha</small>')+'</div>'
   +'<div class="tb"><div class="route">'+esc(t.from||'?')+'<span class="ar">→</span>'+esc(t.to||'?')+'</div>'
   +((t.dep||t.arr)?'<div class="times"><div><span>Sale</span><b>'+(t.dep?esc(fShort(dd))+' '+tm(t.dep):'—')+'</b></div><div><span>Llega</span><b>'+(t.arr?esc(fShort(ad))+' '+tm(t.arr):'—')+'</b></div></div>':'')
   +((t.company||t.ref||(t.attachments&&t.attachments.length)||(t.links&&t.links.length))?'<div class="meta"><span>'+esc(ty[1])+(t.company?' de '+esc(t.company):'')+'</span>'+(t.ref?'<span class="ref">Reserva '+esc(t.ref)+'</span>':'')+attLinkChips(t)+'</div>':'')
   +(t.notes?'<p class="note">'+esc(t.notes)+'</p>':'')
   +costBlock(t)+'</div></div>';
}
function vTransportes(){
  var L=live('transports').sort(function(a,b){return (a.dep||'9999').localeCompare(b.dep||'9999')});
  var h='<div class="bar"><h2>Transportes</h2><button class="primary" data-act="add" data-k="transports">+ Agregar</button></div>';
  if(!L.length)return h+empty('Todavía no cargaron ningún transporte','Vuelos, micros, trenes, barcos, auto alquilado o traslados. Anotá horarios, código de reserva y cuánto costó.');
  return h+totLine(costs().filter(function(c){return c.src==='transports'}))+L.map(ticket).join('');
}

function vAlojamiento(){
  var L=live('lodging').sort(function(a,b){return (a.in||'9999').localeCompare(b.in||'9999')});
  var h='<div class="bar"><h2>Alojamiento</h2><button class="primary" data-act="add" data-k="lodging">+ Agregar</button></div>';
  if(!L.length)return h+empty('Todavía no cargaron dónde van a dormir','Hotel, departamento o hostel: fechas de entrada y salida, dirección, código de reserva y costo.');
  return h+totLine(costs().filter(function(c){return c.src==='lodging'}))+L.map(function(l){
    var n=(l.in&&l.out)?dayDiff(pd(l.in),pd(l.out)):0;
    return '<div class="stay" role="button" tabindex="0" data-act="edit" data-k="lodging" data-id="'+l.id+'"><div class="nm">'+esc(l.name||'Alojamiento')+(l.airbnb?' <a class="abnb" href="'+esc(l.airbnb)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">Airbnb ↗</a>':'')+'</div>'
     +(l.address?'<div class="sub" style="margin:2px 0 0">'+esc(l.address)+'</div>':'')
     +'<div class="dates"><span>Entrada <b>'+(l.in?esc(fShort(l.in)):'—')+'</b></span><span>Salida <b>'+(l.out?esc(fShort(l.out)):'—')+'</b></span>'+(n>0?'<span><b>'+n+(n===1?' noche':' noches')+'</b></span>':'')+attLinkChips(l)+'</div>'
     +(l.ref?'<div class="meta"><span class="ref">Reserva '+esc(l.ref)+'</span></div>':'')
     +(l.notes?'<p class="note">'+esc(l.notes)+'</p>':'')+costBlock(l)+'</div>';
  }).join('');
}

function expRow(e){
  var a=parseFloat(e.amount)||0,cur=(e.cur||base()).toUpperCase(),b=toBase(a,cur);
  return '<div class="exp" role="button" tabindex="0" data-act="edit" data-k="expenses" data-id="'+e.id+'"><span class="ec" aria-hidden="true">'+(CATS[e.cat]||'📌')+'</span><div class="et"><b>'+esc(e.desc||'Gasto')+'</b><small><span>'+esc(e.cat||'Otros')+'</span>'+(e.paidBy?'<span class="who">'+dot(e.paidBy)+esc(pn(e.paidBy))+'</span>':'')+(e.method?'<span>'+esc(e.method)+'</span>':'')+attLinkChips(e)+'</small></div><div class="ea"><b>'+money(a,cur)+'</b>'+(cur!==base()?'<small>'+(b==null?'sin tipo de cambio':'≈ '+money(b))+'</small>':'')+(e.status==='pendiente'?'<span class="pill pend">Por pagar</span>':'')+'</div></div>';
}
function vGastos(){
  var L=live('expenses'),g={};
  L.forEach(function(e){var k=e.date||'0';(g[k]=g[k]||[]).push(e);});
  var keys=Object.keys(g).sort().reverse();
  var h='<div class="bar"><h2>Gastos</h2><button class="primary" data-act="add" data-k="expenses">+ Anotar gasto</button></div>'+balanceHtml();
  if(!L.length)return h+empty('Todavía no anotaron gastos','Cuando estén de viaje, anotá cada gasto: qué fue, cuánto, quién pagó y cómo. Acá se agrupan por día.');
  var all=sumBase(L.map(function(e){return {amount:parseFloat(e.amount)||0,cur:e.cur}}).filter(function(c){return c.amount>0}));
  var nd=keys.filter(function(k){return k!=='0'}).length,dl=parseFloat(S.trip.daily)||0;
  h+='<dl class="stats" style="margin-top:12px"><div><dt>Gastos anotados</dt><dd>'+money(all.t)+'</dd></div>'+(nd?'<div><dt>Promedio por día</dt><dd>'+money(all.t/nd)+'</dd></div>':'')+(dl>0?'<div><dt>Presupuesto diario</dt><dd>'+money(dl)+'</dd></div>':'')+'</dl>'+(all.miss.size?warnMiss(all.miss):'')+'<div style="height:14px"></div>';
  h+=keys.map(function(k){
    var items=g[k].slice().sort(function(a,b){return (b.u||0)-(a.u||0)});
    var s=sumBase(items.map(function(e){return {amount:parseFloat(e.amount)||0,cur:e.cur}})),over=dl>0&&s.t>dl;
    return '<section class="day"><div class="dh"><h3>'+(k==='0'?'Sin fecha':esc(fLong(k)))+'</h3><b class="'+(over?'over':'')+'">'+money(s.t)+'</b></div>'+(dl>0?'<div class="prog"><span class="'+(over?'over':'')+'" style="width:'+Math.min(100,s.t/dl*100)+'%"></span></div>':'')+items.map(expRow).join('')+'</section>';
  }).join('');
  return h;
}

function daysList(){
  var set=new Set(),s=pd(S.trip.start),e=pd(S.trip.end);
  if(s&&e){var n=dayDiff(s,e);if(n>=0&&n<=120){for(var i=0;i<=n;i++){set.add(iso(new Date(s.getFullYear(),s.getMonth(),s.getDate()+i)));}}}
  live('plans').forEach(function(p){if(p.date)set.add(p.date)});
  live('transports').forEach(function(t){if(t.dep)set.add(t.dep.slice(0,10));if(t.arr)set.add(t.arr.slice(0,10));});
  live('lodging').forEach(function(l){if(l.in)set.add(l.in);if(l.out)set.add(l.out);});
  return Array.from(set).sort();
}
function autoRow(ic,time,title,sub){return '<div class="pl auto"><span class="t">'+esc(time)+'</span><div><b>'+ic+' '+esc(title)+'<span class="tag">Reserva</span></b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</div></div>';}
function planRow(p){var ty=ITYPES[p.type]||ITYPES.otro;return '<div class="pl" role="button" tabindex="0" data-act="edit" data-k="plans" data-id="'+p.id+'"><span class="t">'+esc(p.time||'')+'</span><div><b>'+ty[0]+' '+esc(p.title||'Plan')+attLinkChips(p)+'</b>'+(p.place?'<small>'+esc(p.place)+'</small>':'')+(p.notes?'<small>'+esc(p.notes)+'</small>':'')+'</div></div>';}
function vItinerario(){
  var days=daysList(),t=today(),s=pd(S.trip.start);
  var h='<div class="bar"><h2>Itinerario</h2><button class="primary" data-act="add" data-k="plans">+ Agregar plan</button></div>';
  if(!days.length)return h+empty('Todavía no hay días armados','Poné las fechas del viaje en Ajustes, o agregá un plan con su fecha. Los transportes y el alojamiento aparecen solos en su día.');
  return h+days.map(function(d){
    var items=[];
    live('plans').filter(function(p){return p.date===d}).forEach(function(p){items.push({k:p.time||'99:98',h:planRow(p)})});
    live('transports').forEach(function(x){
      var ty=TYPES[x.type]||TYPES.otro,dd=(x.dep||'').slice(0,10),ad=(x.arr||'').slice(0,10);
      if(dd===d)items.push({k:tm(x.dep)||'00:00',h:autoRow(ty[0],tm(x.dep),'Sale: '+(x.from||'?')+' → '+(x.to||'?'),[x.company,x.ref?'Reserva '+x.ref:''].filter(Boolean).join(', '))});
      if(ad===d)items.push({k:tm(x.arr)||'00:01',h:autoRow(ty[0],tm(x.arr),'Llega a '+(x.to||'?'),'')});
    });
    live('lodging').forEach(function(l){
      if(l.out===d)items.push({k:'10:00',h:autoRow('🛏️','','Check-out: '+(l.name||''),'')});
      if(l.in===d)items.push({k:'15:00',h:autoRow('🛏️','','Check-in: '+(l.name||''),l.address||'')});
    });
    items.sort(function(a,b){return a.k.localeCompare(b.k)});
    var dn=s?dayDiff(s,pd(d))+1:0;
    return '<section class="iday"><div class="ih"><h3>'+esc(fLong(d))+'</h3>'+(dn>=1?'<span class="dn">Día '+dn+'</span>':'')+(d===t?'<span class="hoy">Hoy</span>':'')+'<span class="sp"></span><button class="ghost" data-act="add" data-k="plans" data-date="'+esc(d)+'">+ Plan</button></div>'+(items.length?items.map(function(i){return i.h}).join(''):'<div class="nada">Nada planeado todavía.</div>')+'</section>';
  }).join('');
}

var VIEWS={resumen:vResumen,transportes:vTransportes,alojamiento:vAlojamiento,gastos:vGastos,itinerario:vItinerario};

function renderHead(){
  $('#title').textContent=S.trip.name||'Nuestro viaje';
  $('#who2').innerHTML='<span class="chip">'+dot('p1')+esc(S.trip.p1)+'</span><span class="chip">'+dot('p2')+esc(S.trip.p2)+'</span>'+syncChip();
  var s=pd(S.trip.start),e=pd(S.trip.end),w='';
  if(!s){w='<span>Sin fechas todavía</span>';}
  else{
    var d=dayDiff(pd(today()),s),st='';
    if(d>0)st=d===1?'Falta 1 día':'Faltan '+d+' días';
    else if(e&&dayDiff(pd(today()),e)>=0)st='Día '+(1-d)+' de '+(dayDiff(s,e)+1);
    else if(e)st='Viaje terminado';
    else st='Ya empezó';
    w='<span>'+esc(fShort(S.trip.start))+(e?' al '+esc(fShort(S.trip.end)):'')+'</span><b>'+st+'</b>';
  }
  $('#when').innerHTML=w;
  document.title=(S.trip.name||'Viaje de a dos');
}
function render(){
  renderHead();
  $('#main').innerHTML=VIEWS[tab]();
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
}

/* ---------- Formularios ---------- */
function fieldHtml(f,v){
  var val=v[f.k]!=null?v[f.k]:(f.def!=null?f.def:''),id='f_'+f.k,inp;
  if(f.t==='select')inp='<select id="'+id+'" name="'+f.k+'">'+f.opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>';
  else if(f.t==='textarea')inp='<textarea id="'+id+'" name="'+f.k+'" rows="3" placeholder="'+esc(f.ph||'')+'">'+esc(val)+'</textarea>';
  else inp='<input id="'+id+'" name="'+f.k+'" type="'+f.t+'" value="'+esc(val)+'"'+(f.list?' list="'+f.list+'"':'')+(f.t==='number'?' step="any" inputmode="decimal" min="0"':'')+' placeholder="'+esc(f.ph||'')+'"'+(f.req?' required':'')+' autocomplete="off">';
  return '<label class="fld'+(f.half?' half':'')+'"><span>'+esc(f.l)+'</span>'+inp+'</label>';
}
function openSheet(title,body){
  var host=$('#sheet');
  host.innerHTML='<div class="scrim" data-close></div><div class="panel" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="ph"><h2>'+esc(title)+'</h2><button type="button" class="x" data-close aria-label="Cerrar">✕</button></div>'+body+'</div>';
  host.hidden=false;document.body.classList.add('lock');
  return $('.panel',host);
}
function closeSheet(){var h=$('#sheet');h.hidden=true;h.innerHTML='';document.body.classList.remove('lock');render();}
function sheetForm(o){
  var v=o.values||{};
  var panel=openSheet(o.title,'<form id="sf" class="grid" novalidate>'+o.fields.map(function(f){return fieldHtml(f,v)}).join('')+'<div class="acts">'+(o.onDelete?'<button type="button" class="danger" id="del">Eliminar</button>':'')+'<button type="submit" class="primary">Guardar</button></div></form>');
  var f=$('#sf',panel);
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var d={};new FormData(f).forEach(function(val,k){d[k]=String(val).trim()});
    var req=o.fields.filter(function(x){return x.req&&!d[x.k]})[0];
    if(req){var el=$('#f_'+req.k,panel);if(el)el.focus();return;}
    o.onSave(d);closeSheet();
  });
  var del=$('#del',panel);
  if(del)del.addEventListener('click',function(){
    if(!del.classList.contains('armed')){del.classList.add('armed');del.textContent='¿Seguro? Tocá de nuevo';return;}

    var app=mods[0].initializeApp(FIREBASE_CONFIG);fs=mods[1];var st=mods[2];
    try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})});}catch(e){db=fs.getFirestore(app);}
    var storage=st.getStorage(app);

  }catch(e){setSync('err');if(!S.trip.setup)openSettings();return;}

  fs.onSnapshot(fs.doc(db,'trips',CODE),function(snap){
    if(snap.exists()){
      var r=fix({trip:snap.data()}).trip;
      if((!S.trip.setup&&r.setup)||(r.u||0)>(S.trip.u||0)){S.trip=r;save();render();}

    var changed=false;
    snap.docChanges().forEach(function(ch){

      if(d&&ITEM_KEYS.indexOf(d.k)>=0&&applyItem(d.k,d))changed=true;
    });
    if(!reconciled&&!snap.metadata.fromCache){
      reconciled=true;
      var rem={};snap.docs.forEach(function(x){rem[x.id]=x.data().u||0});
      ITEM_KEYS.forEach(function(k){S[k].forEach(function(it){if(rem[it.id]===undefined||(it.u||0)>rem[it.id])pushItem(k,it);});});
    }
    if(changed){save();render();}
    setSync(snap.metadata.fromCache?(navigator.onLine?'connecting':'offline'):(snap.metadata.hasPendingWrites?'saving':'ok'));
  },function(err){fbErr(err);if(!err||err.code!=='permission-denied')setSync('err');});

  });
  function doMerge(text){
    try{var o=JSON.parse(text);if(!o||typeof o!=='object'||!o.trip)throw new Error('x');mergeIn(o);say('Listo, se sumaron los datos.');out.value=JSON.stringify(S);json=out.value;renderHead();}
    catch(e){say('Eso no parece un dato de viaje válido. Revisá que esté copiado completo.',true);}
  }
  $('#mg',panel).addEventListener('click',function(){var v=$('#inp',panel).value.trim();if(!v){say('Pegá primero los datos.',true);return;}doMerge(v);});
  $('#pick',panel).addEventListener('click',function(){$('#fi',panel).click()});
  $('#fi',panel).addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){doMerge(String(r.result||''))};r.readAsText(f);});
  var wipe=$('#wipe',panel);
  wipe.textContent=CODE?'Salir de este viaje':'Borrar todo el viaje';
  wipe.addEventListener('click',function(){
    if(!wipe.classList.contains('armed')){wipe.classList.add('armed');wipe.textContent=CODE?'¿Seguro? Los datos siguen en la nube. Tocá de nuevo':'¿Seguro? Se borra todo. Tocá de nuevo';return;}
    if(CODE){try{localStorage.removeItem(LS);localStorage.removeItem(CODE_KEY);}catch(e){}location.href=location.pathname;}
    else{S=blank();save();closeSheet();openSettings();}
  });
}

/* ---------- Eventos ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-act],[data-close]');if(!t)return;
  if(t.hasAttribute('data-close')){closeSheet();return;}
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);return;}
  var a=t.dataset.act;
  if(a==='add')openItem(t.dataset.k,null,t.dataset.date?{date:t.dataset.date}:null);
  else if(a==='edit')openItem(t.dataset.k,t.dataset.id);
  else if(a==='settings')openSettings();
  else if(a==='sync')openSync();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#sheet').hidden){closeSheet();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.dataset.act){e.preventDefault();e.target.click();}
});
document.addEventListener('change',function(e){
  var r=e.target.closest&&e.target.closest('[data-rate]');
  if(r){S.trip.rates[r.dataset.rate]=parseFloat(r.value)||0;S.trip.u=Date.now();save();pushTrip();render();}
});

render();
if(!FIREBASE_CONFIG.apiKey){if(!S.trip.setup)openSettings();}
else if(LOCAL_ONLY){syncState='local';renderHead();if(!S.trip.setup)openSettings();}
else if(!CODE){syncState='none';renderHead();openConnect();}
else startCloud();
})();
</script>
</body>
</html>
